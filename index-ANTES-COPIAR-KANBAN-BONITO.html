<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSD - Sistema de Gestão Comercial</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fafafa; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: #f0f0f0; }
        .sidebar-item.active { background: #e8f5e9; border-left: 3px solid #4caf50; font-weight: 600; }
        .sortable-header { cursor: pointer; user-select: none; }
        .sortable-header:hover { background: #f5f5f5; }
        .kanban-column { min-height: 600px; background: #f8f9fa; border-radius: 12px; padding: 16px; }
        .contact-card { cursor: move; transition: all 0.2s; }
        .contact-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .contact-card.dragging { opacity: 0.5; }
        .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 4px; }
        .tag-urgente { background: #fee; color: #c00; }
        .tag-vip { background: #fef3c7; color: #92400e; }
        .tag-cold { background: #dbeafe; color: #1e40af; }
        .tag-quente { background: #fecaca; color: #991b1b; }
        .priority-high { border-left: 4px solid #ef4444 !important; }
        .priority-medium { border-left: 4px solid #f59e0b !important; }
        .priority-low { border-left: 4px solid #10b981 !important; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .notification-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 9999px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = '/api';
        
        const api = {
            from: (table) => ({
                select: async () => {
                    const token = sessionStorage.getItem('token');
                    const res = await fetch(API_URL + '/' + table, { headers: token ? {'Authorization': 'Bearer ' + token} : {} });
                    return {data: res.ok ? await res.json() : []};
                },
                insert: async (records) => {
                    const token = sessionStorage.getItem('token');
                    const arr = Array.isArray(records) ? records : [records];
                    for (const r of arr) {
                        await fetch(API_URL + '/' + table, { method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify(r) });
                    }
                },
                update: async (id, record) => {
                    const token = sessionStorage.getItem('token');
                    await fetch(API_URL + '/' + table + '/' + id, { method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify(record) });
                },
                delete: async (id) => {
                    const token = sessionStorage.getItem('token');
                    await fetch(API_URL + '/' + table + '/' + id, { method: 'DELETE', headers: {'Authorization': 'Bearer ' + token} });
                }
            })
        };

        const exportToExcel = (data, filename) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dados");
            XLSX.writeFile(wb, filename + ".xlsx");
        };

        const exportToPDF = (headers, rows, title, filename) => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text(title, 14, 15);
            doc.setFontSize(10);
            doc.text('GSD - Sistema de Gestão Comercial', 14, 22);
            doc.text('Data: ' + new Date().toLocaleDateString('pt-BR'), 14, 28);
            doc.autoTable({
                startY: 35,
                head: [headers],
                body: rows,
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [76, 175, 80], fontStyle: 'bold' }
            });
            doc.save(filename + ".pdf");
        };

        function App() {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('workspace');
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(null);
            const [toast, setToast] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [data, setData] = useState({ usuarios: [], clientes: [], clientesFinais: [], vendedores: [], vendas: [], ligacoes: [] });

            useEffect(() => {
                const saved = localStorage.getItem('user');
                if (saved) setUser(JSON.parse(saved));
                loadData();
                
                // Verificar notificações a cada 30 segundos
                const interval = setInterval(checkNotifications, 30000);
                return () => clearInterval(interval);
            }, []);

            const loadData = async () => {
                const [u, c, cf, vd, v, l] = await Promise.all([
                    api.from('usuarios').select(), api.from('clientes').select(), api.from('clientes_finais').select(),
                    api.from('vendedores').select(), api.from('vendas').select(), api.from('ligacoes').select()
                ]);
                setData({ usuarios: u.data, clientes: c.data, clientesFinais: cf.data, vendedores: vd.data, vendas: v.data, ligacoes: l.data });
                setLoading(false);
                checkNotifications(cf.data);
            };

            const checkNotifications = (contatos = data.clientesFinais) => {
                const now = new Date();
                const newNotifications = [];
                
                contatos.forEach(c => {
                    // Verificar follow-ups pendentes
                    if (c.proximo_followup) {
                        const followupDate = new Date(c.proximo_followup);
                        const diff = followupDate - now;
                        const hoursUntil = diff / (1000 * 60 * 60);
                        
                        if (hoursUntil > 0 && hoursUntil < 2) {
                            newNotifications.push({
                                id: 'followup-' + c.id,
                                type: 'followup',
                                message: `Follow-up com ${c.nome} em ${Math.round(hoursUntil * 60)} minutos`,
                                contact: c,
                                urgent: hoursUntil < 0.5
                            });
                        }
                    }
                    
                    // Verificar leads quentes sem interação há muito tempo
                    if (c.status === 'interessado' || c.status === 'negociacao') {
                        if (c.ultima_interacao) {
                            const lastInteraction = new Date(c.ultima_interacao);
                            const daysSince = (now - lastInteraction) / (1000 * 60 * 60 * 24);
                            
                            if (daysSince > 3) {
                                newNotifications.push({
                                    id: 'cold-' + c.id,
                                    type: 'warning',
                                    message: `${c.nome} está há ${Math.round(daysSince)} dias sem contato!`,
                                    contact: c,
                                    urgent: daysSince > 7
                                });
                            }
                        }
                    }
                });
                
                setNotifications(newNotifications);
            };

            const showToast = (msg, type = 'success') => { 
                setToast({msg, type}); 
                setTimeout(() => setToast(null), 3000); 
            };

            const login = async (email, senha) => {
                const res = await fetch(API_URL + '/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password: senha}) });
                if (res.ok) {
                    const {token, user} = await res.json();
                    sessionStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    setUser(user);
                    return true;
                }
                return false;
            };

            const addCliente = async (form) => { await api.from('clientes').insert([form]); await loadData(); setShowModal(null); showToast('Cliente adicionado!'); };
            const editCliente = async (id, form) => { await api.from('clientes').update(id, form); await loadData(); setShowModal(null); showToast('Cliente atualizado!'); };
            const deleteCliente = async (id) => { await api.from('clientes').delete(id); await loadData(); showToast('Cliente excluído!'); };
            
            const addContato = async (form) => { 
                await api.from('clientes_finais').insert([{...form, status: 'novo', ultima_interacao: new Date().toISOString()}]); 
                await loadData(); 
                setShowModal(null); 
                showToast('Lead adicionado!'); 
            };
            
            const editContato = async (id, form) => { 
                await api.from('clientes_finais').update(id, {...form, ultima_interacao: new Date().toISOString()}); 
                await loadData(); 
                setShowModal(null); 
                showToast('Lead atualizado!'); 
            };
            
            const deleteContato = async (id) => { await api.from('clientes_finais').delete(id); await loadData(); showToast('Lead excluído!'); };
            
            const addVenda = async (form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                const comissao = parseFloat(form.valor_bruto) * (parseFloat(cliente.percentual_comissao) / 100);
                await api.from('vendas').insert([{ cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), valor_bruto: parseFloat(form.valor_bruto), valor_comissao: comissao, data: new Date().toISOString(), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, faturada: false }]);
                await loadData(); setShowModal(null); showToast('Venda registrada!', 'success');
            };
            
            const editVenda = async (id, form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                const comissao = parseFloat(form.valor_bruto) * (parseFloat(cliente.percentual_comissao) / 100);
                await api.from('vendas').update(id, { cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), valor_bruto: parseFloat(form.valor_bruto), valor_comissao: comissao, cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, faturada: form.faturada });
                await loadData(); setShowModal(null); showToast('Venda atualizada!');
            };
            
            const deleteVenda = async (id) => { await api.from('vendas').delete(id); await loadData(); showToast('Venda excluída!'); };

            const addLigacao = async (form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                await api.from('ligacoes').insert([{ cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), data: new Date().toISOString(), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, status: form.status }]);
                
                // Atualizar última interação do contato
                const contato = data.clientesFinais.find(c => c.cliente_primario_id === parseInt(form.cliente_id));
                if (contato) {
                    await api.from('clientes_finais').update(contato.id, { ultima_interacao: new Date().toISOString() });
                }
                
                await loadData(); 
                setShowModal(null); 
                showToast('Atividade registrada!');
            };
            
            const editLigacao = async (id, form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                await api.from('ligacoes').update(id, { cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, status: form.status });
                await loadData(); setShowModal(null); showToast('Atividade atualizada!');
            };
            
            const deleteLigacao = async (id) => { await api.from('ligacoes').delete(id); await loadData(); showToast('Atividade excluída!'); };

            const importExcel = async (file) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    for (const row of json) {
                        await api.from('clientes_finais').insert([{ 
                            nome: row.Nome || row.nome, 
                            telefone: row.Telefone || row.telefone, 
                            whatsapp: row.WhatsApp || row.whatsapp, 
                            email: row.Email || row.email, 
                            cliente_primario_id: parseInt(row.ClienteID || row.cliente_id || 1), 
                            status: 'novo',
                            ultima_interacao: new Date().toISOString()
                        }]);
                    }
                    await loadData(); setShowModal(null); showToast('Importado ' + json.length + ' leads!');
                };
                reader.readAsArrayBuffer(file);
            };

            const fmt = (v) => new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(v);

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!user) return <Login onLogin={login} />;

            const kpis = { 
                faturamento: data.vendas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0), 
                comissoes: data.vendas.reduce((s, v) => s + parseFloat(v.valor_comissao || 0), 0), 
                totalLig: data.ligacoes.length, 
                ligEfet: data.ligacoes.filter(l => l.status === 'efetivada').length, 
                totalVendas: data.vendas.length,
                ticketMedio: data.vendas.length > 0 ? data.vendas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0) / data.vendas.length : 0,
                taxaConversao: data.ligacoes.length > 0 ? (data.vendas.length / data.ligacoes.filter(l => l.status === 'efetivada').length) * 100 : 0,
                vendasPendentes: data.vendas.filter(v => !v.faturada).length,
                vendasFaturadas: data.vendas.filter(v => v.faturada).length,
                totalClientes: data.clientes.length,
                totalContatos: data.clientesFinais.length
            };

            const menuItems = [
                {id: 'workspace', icon: '⚡', label: 'Área de Trabalho', badge: notifications.length},
                {id: 'pipeline', icon: '🔄', label: 'Pipeline'},
                {id: 'dashboard', icon: '📊', label: 'Dashboard'}, 
                {id: 'vendas', icon: '💰', label: 'Vendas'}, 
                {id: 'clientes', icon: '🏢', label: 'Clientes'}, 
                {id: 'clientes_finais', icon: '👥', label: 'Contatos'}, 
                {id: 'ligacoes', icon: '📞', label: 'Atividades'}
            ];

            return (
                <div className="flex h-screen" style={{background: '#fafafa'}}>
                    <div className="w-64 bg-white border-r flex flex-col">
                        <div className="p-6 border-b">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">G</div>
                                <div><div className="font-bold text-lg">GSD</div><div style={{fontSize: '11px'}} className="text-gray-500">Gestão Comercial</div></div>
                            </div>
                        </div>
                        <div className="flex-1 py-4">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => setPage(item.id)} className={'sidebar-item w-full flex items-center gap-3 px-6 py-3 text-left relative ' + (page === item.id ? 'active text-green-700' : 'text-gray-700')}>
                                    <span className="text-xl">{item.icon}</span>
                                    <span style={{fontSize: '13px'}} className="font-medium flex-1">{item.label}</span>
                                    {item.badge > 0 && <span className="bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">{item.badge}</span>}
                                </button>
                            ))}
                        </div>
                        <div className="border-t p-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-700">{user.nome.charAt(0)}</div>
                                <div className="flex-1"><div style={{fontSize: '13px'}} className="font-medium">{user.nome}</div><div style={{fontSize: '11px'}} className="text-gray-500">{user.perfil}</div></div>
                                <button onClick={() => { setUser(null); sessionStorage.clear(); localStorage.clear(); }} className="text-gray-400 hover:text-gray-600">↗</button>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col overflow-hidden">
                        <div className="bg-white border-b px-8 py-4 flex items-center justify-between">
                            <div>
                                <h1 style={{fontSize: '22px'}} className="font-bold text-gray-900">{menuItems.find(m => m.id === page)?.label}</h1>
                                <p style={{fontSize: '12px'}} className="text-gray-500 mt-0.5">
                                    {page === 'workspace' && notifications.length > 0 && `${notifications.length} notificações pendentes`}
                                    {page !== 'workspace' && 'Visão geral e métricas'}
                                </p>
                            </div>
                            <div className="flex gap-3">
                                {page === 'workspace' && <button onClick={() => setShowModal({type: 'contato'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Novo Lead</button>}
                                {page === 'vendas' && <button onClick={() => setShowModal({type: 'venda'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Nova Venda</button>}
                                {page === 'clientes' && <button onClick={() => setShowModal({type: 'cliente'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Novo Cliente</button>}
                                {page === 'clientes_finais' && (<><button onClick={() => setShowModal({type: 'import'})} className="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">📊 Importar</button><button onClick={() => setShowModal({type: 'contato'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Novo Contato</button></>)}
                                {page === 'ligacoes' && <button onClick={() => setShowModal({type: 'ligacao'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Nova Atividade</button>}
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-8">
                            {page === 'pipeline' && <Pipeline contatos={data.clientesFinais} clientes={data.clientes} ligacoes={data.ligacoes} vendas={data.vendas} onUpdateContact={editContato} showToast={showToast} onOpenDetails={(c) => setShowModal({type: 'detalhes', data: c})} />}
                            {page === 'workspace' && <Workspace contatos={data.clientesFinais} clientes={data.clientes} ligacoes={data.ligacoes} vendas={data.vendas} notifications={notifications} onUpdateContact={editContato} showToast={showToast} onAddLigacao={addLigacao} onOpenDetails={(c) => setShowModal({type: 'detalhes', data: c})} />}
                            {page === 'dashboard' && <Dashboard kpis={kpis} fmt={fmt} vendas={data.vendas} ligacoes={data.ligacoes} vendedores={data.vendedores} />}
                            {page === 'vendas' && <Vendas vendas={data.vendas} vendedores={data.vendedores} clientes={data.clientes} fmt={fmt} showToast={showToast} onEdit={(v) => setShowModal({type: 'venda', data: v})} onDelete={deleteVenda} />}
                            {page === 'clientes' && <Clientes clientes={data.clientes} showToast={showToast} onEdit={(c) => setShowModal({type: 'cliente', data: c})} onDelete={deleteCliente} />}
                            {page === 'clientes_finais' && <Contatos contatos={data.clientesFinais} clientes={data.clientes} showToast={showToast} onEdit={(c) => setShowModal({type: 'contato', data: c})} onDelete={deleteContato} />}
                            {page === 'ligacoes' && <Atividades ligacoes={data.ligacoes} vendedores={data.vendedores} clientes={data.clientes} showToast={showToast} onEdit={(l) => setShowModal({type: 'ligacao', data: l})} onDelete={deleteLigacao} />}
                        </div>
                    </div>
                    {toast && (
                        <div style={{position: 'fixed', top: '20px', right: '20px', background: 'white', padding: '14px 20px', borderRadius: '10px', boxShadow: '0 4px 12px rgba(0,0,0,0.1)', borderLeft: toast.type === 'error' ? '3px solid #ef4444' : '3px solid #4caf50', fontSize: '13px'}}>
                            <span className="font-medium">{toast.type === 'error' ? '✕' : '✓'} {toast.msg}</span>
                        </div>
                    )}
                    {showModal?.type === 'cliente' && <ModalCliente data={showModal.data} onSave={(f) => showModal.data ? editCliente(showModal.data.id, f) : addCliente(f)} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'contato' && <ModalContato data={showModal.data} clientes={data.clientes} onSave={(f) => showModal.data ? editContato(showModal.data.id, f) : addContato(f)} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'venda' && <ModalVenda data={showModal.data} clientes={data.clientes} vendedores={data.vendedores} onSave={(f) => showModal.data ? editVenda(showModal.data.id, f) : addVenda(f)} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'ligacao' && <ModalLigacao data={showModal.data} clientes={data.clientes} vendedores={data.vendedores} onSave={(f) => showModal.data ? editLigacao(showModal.data.id, f) : addLigacao(f)} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'import' && <ModalImport onImport={importExcel} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'detalhes' && <ModalDetalhes contato={showModal.data} clientes={data.clientes} ligacoes={data.ligacoes} vendas={data.vendas} onClose={() => setShowModal(null)} onSave={editContato} showToast={showToast} />}
                    {showModal?.type === 'nota' && <ModalNota contato={showModal.data} onSave={editContato} onClose={() => setShowModal(null)} showToast={showToast} />}
                    {showModal?.type === 'followup' && <ModalFollowup contato={showModal.data} onSave={editContato} onClose={() => setShowModal(null)} showToast={showToast} />}
                </div>
            );
        }

        function Login({ onLogin }) {
            const [email, setEmail] = useState(''); 
            const [senha, setSenha] = useState(''); 
            const [erro, setErro] = useState('');
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center p-4">

        function Workspace({ contatos, clientes, ligacoes, vendas, notifications, onUpdateContact, showToast, onAddLigacao, onOpenDetails }) {
            const [selectedContact, setSelectedContact] = useState(null);

            // 🧠 FUNÇÕES DE INTELIGÊNCIA
            const calcularScoreLead = (contato) => {
                let score = 0;
                const agora = new Date();
                
                // Status no funil
                const statusScores = { 'negociacao': 35, 'interessado': 25, 'contato': 15, 'novo': 10, 'fechado': 0 };
                score += statusScores[contato.status] || 0;
                
                // Prioridade manual
                if (contato.prioridade === 'high') score += 25;
                else if (contato.prioridade === 'medium') score += 15;
                
                // Tempo sem contato
                if (contato.ultima_interacao) {
                    const dias = (agora - new Date(contato.ultima_interacao)) / (1000 * 60 * 60 * 24);
                    if (dias < 1) score += 20;
                    else if (dias < 3) score += 15;
                    else if (dias < 7) score += 10;
                }
                
                // Follow-up urgente
                if (contato.proximo_followup) {
                    const horas = (new Date(contato.proximo_followup) - agora) / (1000 * 60 * 60);
                    if (horas > 0 && horas < 2) score += 20;
                }
                
                return Math.min(score, 100);
            };
            
            const sugerirAcaoIA = (contato) => {
                if (contato.status === 'negociacao') return '🔥 FECHAR AGORA';
                if (contato.status === 'interessado') return '📞 LIGAR HOJE';
                if (contato.status === 'contato') return '💬 ACOMPANHAR';
                if (contato.status === 'novo') return '📱 PRIMEIRO CONTATO';
                return '⏰ AGUARDAR';
            };

            const calcProbabilidadeIA = (contato, ligacoes) => {

            const analisarTempoParado = (contato) => {
                if (!contato.ultima_interacao) return { dias: 999, alerta: "🆕 Lead novo - contatar hoje!" };
                const dias = Math.floor((new Date() - new Date(contato.ultima_interacao)) / (1000 * 60 * 60 * 24));
                if (dias >= 7) return { dias, alerta: "🚨 Parado há " + dias + " dias - URGENTE!" };
                if (dias >= 3) return { dias, alerta: "⚠️ Sem contato há " + dias + " dias" };
                return { dias, alerta: "✅ Engajamento recente" };

                const hora = new Date().getHours();
                if (contato.status === "negociacao") return "☎️ AGORA (não espere!)";
                if (hora < 9) return "⏰ 9h-11h (melhor período)";
                if (hora >= 12 && hora < 14) return "⏰ 14h-16h (pós-almoço)";
                if (hora >= 18) return "⏰ Amanhã 9h-11h";
                return "☎️ AGORA (horário ideal)";

            const gerarRoteiro = (contato) => {
                if (contato.status === "negociacao") return "Foco: fechar venda, resolver objeções finais";
                if (contato.status === "interessado") return "Foco: agendar demonstração, criar urgência";
                if (contato.status === "contato") return "Foco: qualificar necessidade, despertar interesse";
                return "Foco: apresentar solução, entender dor do cliente";
            };

                let prob = 0;
                if (contato.status === 'negociacao') prob = 70;
                else if (contato.status === 'interessado') prob = 40;
                else if (contato.status === 'contato') prob = 20;
                else if (contato.status === 'novo') prob = 10;
                const ligacoesContato = ligacoes.filter(l => l.cliente_id === contato.cliente_primario_id);

                return Math.min(prob, 95);

            ];

            const availableTags = ['urgente', 'vip', 'cold', 'quente'];
            const availablePriorities = ['high', 'medium', 'low'];

            const getContactsByStatus = (status) => {
                let filtered = contatos.filter(c => (c.status || 'novo') === status);
                
                if (busca) {
                    filtered = filtered.filter(c => 
                        c.nome.toLowerCase().includes(busca.toLowerCase()) ||
                        (c.email && c.email.toLowerCase().includes(busca.toLowerCase())) ||
                        (c.telefone && c.telefone.includes(busca))

                }
                
                if (filtroTag) {

                        return tags.includes(filtroTag);

                return filtered;

            const handleDragStart = (e, contact) => {

            const openWhatsApp = (phone) => {

            const ligarAgora = (contact) => {

                    registrarLigacao(contact, 'tentada');

            // Calcular estatísticas do dia
            const hoje = new Date().toDateString();
            const ligacoesHoje = ligacoes.filter(l => new Date(l.data).toDateString() === hoje);
            const vendasHoje = vendas.filter(v => new Date(v.data).toDateString() === hoje);
            const todayStats = {
                ligacoes: ligacoesHoje.length,

            const getColumnStats = (status) => {

                const ligacoesColuna = ligacoes.filter(l => {
                    const contato = contatos.find(c => c.cliente_primario_id === l.cliente_id && c.status === status);
                    return contato !== undefined;

                return {

                    comFollowup: contatosColuna.filter(c => c.proximo_followup).length,
                    prioridadeAlta: contatosColuna.filter(c => c.prioridade === 'high').length,
                    semInteracao: contatosColuna.filter(c => {
                        if (!c.ultima_interacao) return true;
                        const dias = (new Date() - new Date(c.ultima_interacao)) / (1000 * 60 * 60 * 24);
                        return dias > 7;

            return (
                <div className="space-y-5">

                            </div>
                        </div>

                    <div className="grid grid-cols-3 gap-4 mb-5">
                        {contatos
                            .map(c => ({ ...c, scoreIA: calcularScoreLead(c), probIA: calcProbabilidadeIA(c, ligacoes), acaoIA: sugerirAcaoIA(c) }))

                                <div key={lead.id} className={"p-5 rounded-xl shadow-xl cursor-pointer hover:scale-105 transition-all " + (lead.scoreIA >= 70 ? "bg-gradient-to-br from-red-500 to-orange-500" : lead.scoreIA >= 50 ? "bg-gradient-to-br from-orange-400 to-yellow-400" : "bg-gradient-to-br from-blue-500 to-purple-500")} onClick={() => onOpenDetails(lead)}>

                                        📞 LIGAR AGORA

                                </div>
                            ))
                        }
                    </div>


                    {/* Métricas do Dia */}
                    <div className="grid grid-cols-5 gap-4">

                                <span className="text-2xl">📞</span>

                    {/* Filtros */}

                            <select

            const [filtroTag, setFiltroTag] = useState('');
            const [filtroPrioridade, setFiltroPrioridade] = useState('');
            const [draggedContact, setDraggedContact] = useState(null);
            
            const statusColumns = [

            const availableTags = ['urgente', 'vip', 'cold', 'quente'];
            
            const ligarAgora = (contact) => { window.open('tel:' + contact.telefone); showToast('Ligando para ' + contact.nome + '...'); };

            const enviarEmail = (contact) => { window.open('mailto:' + contact.email); };
            
            const filteredContatos = contatos.filter(c => {
                const mb = !busca || c.nome.toLowerCase().includes(busca.toLowerCase());

                const mp = !filtroPrioridade || c.prioridade === filtroPrioridade;
                return mb && mt && mp;
            });
            
            const getContactsByStatus = (status) => filteredContatos.filter(c => c.status === status);
            const getColumnStats = (status) => {
                const cts = getContactsByStatus(status);
                return { total: cts.length, prioridadeAlta: cts.filter(c => c.prioridade === 'high').length };
            };
            
            const handleDragStart = (e, contact) => { setDraggedContact(contact); };
            const handleDragOver = (e) => { e.preventDefault(); };
            const handleDrop = async (e, newStatus) => {
                e.preventDefault();
                if (draggedContact && draggedContact.status !== newStatus) {
                    await onUpdateContact(draggedContact.id, { status: newStatus });
                    showToast('Lead movido!');

                setDraggedContact(null);
            };
            
            return (<div className="p-6"><h1 className="text-2xl font-bold mb-4">Pipeline de Vendas</h1><div className="bg-white p-4 rounded-xl mb-4"><div className="grid grid-cols-4 gap-3"><input type="text" placeholder="🔍 Buscar..." value={busca} onChange={(e) => setBusca(e.target.value)} className="px-4 py-2 border rounded-lg text-sm" /><select value={filtroTag} onChange={(e) => setFiltroTag(e.target.value)} className="px-4 py-2 border rounded-lg text-sm"><option value="">Tags</option>{availableTags.map(t => <option key={t} value={t}>{t}</option>)}</select><select value={filtroPrioridade} onChange={(e) => setFiltroPrioridade(e.target.value)} className="px-4 py-2 border rounded-lg text-sm"><option value="">Prioridade</option><option value="high">Alta</option></select><button onClick={() => { setBusca(''); setFiltroTag(''); setFiltroPrioridade(''); }} className="px-4 py-2 bg-gray-100 rounded-lg text-sm">Limpar</button></div></div><div className="grid grid-cols-5 gap-4">{statusColumns.map(col => (<div key={col.id} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, col.id)} className="bg-gray-50 p-3 rounded-lg min-h-screen"><div className="flex justify-between mb-3"><h3 className="font-bold text-sm">{col.label}</h3><span className="text-xs px-2 py-1 rounded-full bg-gray-200">{getColumnStats(col.id).total}</span></div><div className="space-y-2">{getContactsByStatus(col.id).map(c => (<div key={c.id} draggable onDragStart={(e) => handleDragStart(e, c)} className="bg-white p-3 rounded shadow-sm border cursor-move hover:shadow-md"><div className="font-semibold text-sm mb-1">{c.nome}</div><div className="text-xs text-gray-500 mb-2">{clientes.find(cl => cl.id === c.cliente_primario_id)?.nome}</div><div className="flex gap-1"><button onClick={() => ligarAgora(c)} className="flex-1 bg-green-500 text-white px-2 py-1 rounded text-xs">📞</button><button onClick={() => onOpenDetails(c)} className="flex-1 bg-gray-500 text-white px-2 py-1 rounded text-xs">👁️</button></div></div>))}</div></div>))}</div></div>);
        }

                if (pieRef.current) { const vData = vendedores.map(vd => ({ nome: vd.nome, total: vendas.filter(v => v.vendedor_id === vd.id).reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0) })); new Chart(pieRef.current, { type: 'doughnut', data: { labels: vData.map(v => v.nome), datasets: [{ data: vData.map(v => v.total), backgroundColor: ['#4caf50', '#2196f3', '#ff9800', '#e91e63'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } } }); }
                if (barRef.current) { new Chart(barRef.current, { type: 'bar', data: { labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'], datasets: [{ label: 'Efetivadas', data: [12, 15, 18, 14, 20, 8], backgroundColor: '#4caf50' }, { label: 'Tentadas', data: [5, 8, 6, 7, 9, 3], backgroundColor: '#e0e0e0' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { size: 10 } } } }, scales: { x: { stacked: true, ticks: { font: { size: 10 } } }, y: { stacked: true, beginAtZero: true, ticks: { font: { size: 10 } } } } } }); }
            }, [vendas, vendedores]);

            const colorMap = { green: 'bg-green-100 text-green-700', blue: 'bg-blue-100 text-blue-700', purple: 'bg-purple-100 text-purple-700', orange: 'bg-orange-100 text-orange-700', indigo: 'bg-indigo-100 text-indigo-700', pink: 'bg-pink-100 text-pink-700', yellow: 'bg-yellow-100 text-yellow-700', teal: 'bg-teal-100 text-teal-700', cyan: 'bg-cyan-100 text-cyan-700', lime: 'bg-lime-100 text-lime-700' };

            return (<div className="space-y-5"><div className="flex items-center justify-between"><div><h2 style={{fontSize: '14px'}} className="font-bold text-gray-900">Indicadores Principais</h2><p style={{fontSize: '11px'}} className="text-gray-500">Selecione até 8 KPIs para visualizar</p></div><button onClick={() => setShowKpiSelector(!showKpiSelector)} className="text-xs font-medium text-green-600 hover:text-green-700 bg-green-50 px-4 py-2 rounded-lg">{showKpiSelector ? '✕ Fechar' : '⚙ Personalizar KPIs'}</button></div>{showKpiSelector && (<div className="bg-white p-5 rounded-xl shadow-sm border"><div className="grid grid-cols-5 gap-3">{availableKpis.map(kpi => (<button key={kpi.id} onClick={() => toggleKpi(kpi.id)} className={'p-3 rounded-lg border-2 transition-all text-left ' + (selectedKpis.includes(kpi.id) ? 'border-green-500 bg-green-50' : 'border-gray-200 hover:border-gray-300')}><div className="flex items-center justify-between mb-1"><span className="text-lg">{kpi.icon}</span>{selectedKpis.includes(kpi.id) && <span className="text-green-600 text-xs">✓</span>}</div><div style={{fontSize: '11px'}} className="font-medium text-gray-700">{kpi.label}</div></button>))}</div></div>)}<div className="grid grid-cols-4 gap-4">{selectedKpis.map(kpiId => { const kpi = availableKpis.find(k => k.id === kpiId); return (<div key={kpi.id} className="bg-white p-5 rounded-xl shadow-sm hover:shadow-md transition-all border border-gray-100"><div className="flex items-center justify-between mb-3"><div className="text-2xl">{kpi.icon}</div><div style={{fontSize: '10px'}} className={'font-semibold px-2 py-1 rounded ' + colorMap[kpi.color]}>{kpi.badge}</div></div><div style={{fontSize: '24px'}} className="font-bold text-gray-900 mb-1">{kpi.value}</div><div style={{fontSize: '11px'}} className="text-gray-500 font-medium">{kpi.label}</div></div>); })}</div><div className="grid grid-cols-3 gap-5"><div className="col-span-2 bg-white p-5 rounded-xl shadow-sm border border-gray-100"><h3 style={{fontSize: '13px'}} className="font-bold mb-4 text-gray-900">📈 Evolução de Faturamento</h3><div style={{height: '280px'}}><canvas ref={lineRef}></canvas></div></div><div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100"><h3 style={{fontSize: '13px'}} className="font-bold mb-4 text-gray-900">🥧 Vendas por Vendedor</h3><div style={{height: '280px'}}><canvas ref={pieRef}></canvas></div></div></div><div className="grid grid-cols-3 gap-5"><div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100"><h3 style={{fontSize: '13px'}} className="font-bold mb-4 text-gray-900">📊 Ligações da Semana</h3><div style={{height: '220px'}}><canvas ref={barRef}></canvas></div></div><div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100"><h3 style={{fontSize: '13px'}} className="font-bold mb-4 text-gray-900">🔥 Últimas Vendas</h3><div className="space-y-2.5">{vendas.slice(0, 4).map((v, i) => (<div key={i} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-all"><div><div style={{fontSize: '12px'}} className="font-medium text-gray-900">{v.cliente_nome}</div><div style={{fontSize: '10px'}} className="text-gray-500">{v.vendedor_nome}</div></div><div style={{fontSize: '14px'}} className="font-bold text-green-600">{fmt(v.valor_bruto)}</div></div>))}</div></div><div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100"><h3 style={{fontSize: '13px'}} className="font-bold mb-4 text-gray-900">⚡ Atividades</h3><div className="space-y-2.5">{ligacoes.slice(0, 4).map((l, i) => (<div key={i} className="flex items-center gap-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-all"><div className={'w-2 h-2 rounded-full ' + (l.status === 'efetivada' ? 'bg-green-500' : 'bg-gray-300')}></div><div className="flex-1"><div style={{fontSize: '12px'}} className="font-medium text-gray-900">{l.cliente_nome}</div><div style={{fontSize: '10px'}} className="text-gray-500">{l.vendedor_nome}</div></div></div>))}</div></div></div></div>);

        function Vendas({ vendas, vendedores, clientes, fmt, showToast, onEdit, onDelete }) {
            const [busca, setBusca] = useState('');
            const [filtroVendedor, setFiltroVendedor] = useState('');
            const [filtroCliente, setFiltroCliente] = useState('');
            const [filtroStatus, setFiltroStatus] = useState('');
            const [ordenacao, setOrdenacao] = useState({ campo: 'data', direcao: 'desc' });
            const [paginaAtual, setPaginaAtual] = useState(1);
            const itensPorPagina = 10;

            let vendasFiltradas = vendas.filter(v => {
                const buscaMatch = busca === '' || v.cliente_nome.toLowerCase().includes(busca.toLowerCase()) || v.vendedor_nome.toLowerCase().includes(busca.toLowerCase());
                const vendedorMatch = filtroVendedor === '' || v.vendedor_id === parseInt(filtroVendedor);
                const clienteMatch = filtroCliente === '' || v.cliente_id === parseInt(filtroCliente);
                const statusMatch = filtroStatus === '' || (filtroStatus === 'faturada' && v.faturada) || (filtroStatus === 'pendente' && !v.faturada);
                return buscaMatch && vendedorMatch && clienteMatch && statusMatch;
            });

            vendasFiltradas.sort((a, b) => {
                let valA = a[ordenacao.campo];
                let valB = b[ordenacao.campo];
                if (ordenacao.campo === 'valor_bruto' || ordenacao.campo === 'valor_comissao') {
                    valA = parseFloat(valA || 0);
                    valB = parseFloat(valB || 0);
                }
                if (valA < valB) return ordenacao.direcao === 'asc' ? -1 : 1;
                if (valA > valB) return ordenacao.direcao === 'asc' ? 1 : -1;
                return 0;
            });

            const totalPaginas = Math.ceil(vendasFiltradas.length / itensPorPagina);
            const vendasPaginadas = vendasFiltradas.slice((paginaAtual - 1) * itensPorPagina, paginaAtual * itensPorPagina);

            const alternarOrdenacao = (campo) => {
                if (ordenacao.campo === campo) {
                    setOrdenacao({ campo, direcao: ordenacao.direcao === 'asc' ? 'desc' : 'asc' });
                } else {
                    setOrdenacao({ campo, direcao: 'asc' });
                }
            };

            const limparFiltros = () => {
                setBusca('');
                setFiltroVendedor('');
                setFiltroCliente('');
                setFiltroStatus('');
                setPaginaAtual(1);
            };

            const exportarExcel = () => {
                const dados = vendasFiltradas.map(v => ({
                    Cliente: v.cliente_nome,
                    Vendedor: v.vendedor_nome,
                    'Valor Bruto': parseFloat(v.valor_bruto),
                    'Comissão': parseFloat(v.valor_comissao),
                    Status: v.faturada ? 'Faturada' : 'Pendente',
                    Data: new Date(v.data).toLocaleDateString('pt-BR')
                }));
                exportToExcel(dados, 'Vendas_' + new Date().toISOString().split('T')[0]);
                showToast('Excel exportado com sucesso!');
            };

            const exportarPDF = () => {
                const headers = ['Cliente', 'Vendedor', 'Valor', 'Status'];
                const rows = vendasFiltradas.map(v => [
                    v.cliente_nome,
                    v.vendedor_nome,
                    fmt(v.valor_bruto),
                    v.faturada ? 'Faturada' : 'Pendente'
                ]);
                exportToPDF(headers, rows, 'Relatório de Vendas', 'Vendas_' + new Date().toISOString().split('T')[0]);
                showToast('PDF exportado com sucesso!');
            };

            const handleDelete = (id) => {
                if (window.confirm('Tem certeza que deseja excluir esta venda?')) {
                    onDelete(id);
                }

                                    <div className="flex items-center justify-between">
                                        <span className="font-semibold">{new Date(contato.proximo_followup).toLocaleString('pt-BR')}</span>
                                        <button onClick={() => salvarFollowup(null)} className="text-xs text-red-600 hover:underline">Cancelar</button>
                                    </div>
                                ) : (
                                    <div className="flex gap-2">
                                        <input 
                                            type="datetime-local" 
                                            className="flex-1 px-3 py-2 border rounded-lg text-sm"
                                            onChange={(e) => salvarFollowup(e.target.value)}
                                        />
                                    </div>
                                )}
                            </div>
                            
                            {/* Notas Rápidas */}
                            <div className="bg-yellow-50 p-4 rounded-lg">
                                <div className="font-bold mb-2">📝 Notas</div>
                                {contato.notas && (
                                    <div className="bg-white p-3 rounded-lg mb-3 text-sm whitespace-pre-wrap max-h-40 overflow-y-auto">
                                        {contato.notas}
                                    </div>
                                )}
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Adicionar nota rápida..."
                                        value={novaAnotacao}
                                        onChange={(e) => setNovaAnotacao(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && adicionarNota()}
                                        className="flex-1 px-3 py-2 border rounded-lg text-sm"
                                    />
                                    <button onClick={adicionarNota} className="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                        Adicionar
                                    </button>
                                </div>
                            </div>
                            
                            {/* Histórico */}
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <h3 className="font-bold mb-3">📞 Histórico de Ligações</h3>
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {historicoLigacoes.length > 0 ? historicoLigacoes.map((l, i) => (
                                            <div key={i} className="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
                                                <div className={'w-2 h-2 rounded-full ' + (l.status === 'efetivada' ? 'bg-green-500' : 'bg-gray-300')}></div>
                                                <div className="flex-1">
                                                    <div className="text-sm font-medium">{l.status === 'efetivada' ? 'Efetivada' : 'Tentada'}</div>
                                                    <div className="text-xs text-gray-500">{new Date(l.data).toLocaleDateString('pt-BR')}</div>
                                                </div>
                                            </div>
                                        )) : <div className="text-sm text-gray-500 text-center py-4">Nenhuma ligação registrada</div>}
                                    </div>
                                </div>
                                <div>
                                    <h3 className="font-bold mb-3">💰 Histórico de Vendas</h3>
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {historicoVendas.length > 0 ? historicoVendas.map((v, i) => (
                                            <div key={i} className="p-3 bg-gray-50 rounded-lg">
                                                <div className="flex justify-between items-start">
                                                    <div className="text-sm font-medium">{v.vendedor_nome}</div>
                                                    <div className="text-sm font-bold text-green-600">
                                                        {new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(v.valor_bruto)}
                                                    </div>
                                                </div>
                                                <div className="text-xs text-gray-500 mt-1">{new Date(v.data).toLocaleDateString('pt-BR')}</div>
                                            </div>
                                        )) : <div className="text-sm text-gray-500 text-center py-4">Nenhuma venda registrada</div>}
                                    </div>
                                </div>
                            </div>
                            
                            {/* Última Interação */}
                            {contato.ultima_interacao && (
                                <div className="bg-gray-50 p-3 rounded-lg text-sm text-gray-600">
                                    <strong>Última interação:</strong> {new Date(contato.ultima_interacao).toLocaleString('pt-BR')}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ModalNota({ contato, onSave, onClose, showToast }) {
            const [nota, setNota] = useState('');
            return (
                <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} onClick={onClose}>
                    <div style={{background: 'white', borderRadius: '16px', padding: '32px', maxWidth: '500px', width: '100%', margin: '16px'}} onClick={(e) => e.stopPropagation()}>
                        <h2 className="text-xl font-bold mb-6">Adicionar Nota</h2>
                        <textarea 
                            value={nota} 
                            onChange={(e) => setNota(e.target.value)}
                            placeholder="Digite sua nota aqui..."
                            className="w-full px-4 py-3 border rounded-lg text-sm h-32 resize-none"
                        />
                        <div className="flex gap-3 mt-4">
                            <button 
                                onClick={() => {
                                    const notasAtuais = contato.notas || '';
                                    const novasNotas = notasAtuais ? notasAtuais + '\n' + nota : nota;
                                    onSave(contato.id, {...contato, notas: novasNotas});
                                    onClose();
                                }}
                                className="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold text-sm"
                            >
                                Salvar
                            </button>
                            <button onClick={onClose} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold text-sm">Cancelar</button>
                        </div>
                    </div>
                </div>
            );
        }

        function ModalFollowup({ contato, onSave, onClose, showToast }) {
            const [dataHora, setDataHora] = useState('');
            return (
                <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} onClick={onClose}>
                    <div style={{background: 'white', borderRadius: '16px', padding: '32px', maxWidth: '400px', width: '100%', margin: '16px'}} onClick={(e) => e.stopPropagation()}>
                        <h2 className="text-xl font-bold mb-6">Agendar Follow-up</h2>
                        <div className="mb-4">
                            <label className="block text-sm font-medium mb-2">Data e Hora</label>
                            <input 
                                type="datetime-local" 
                                value={dataHora}
                                onChange={(e) => setDataHora(e.target.value)}
                                className="w-full px-4 py-3 border rounded-lg text-sm"
                            />
                        </div>
                        <div className="flex gap-3">
                            <button 
                                onClick={() => {
                                    onSave(contato.id, {...contato, proximo_followup: dataHora});
                                    onClose();
                                }}
                                disabled={!dataHora}
                                className="flex-1 bg-green-500 hover:bg-green-600 disabled:bg-gray-300 text-white py-3 rounded-lg font-semibold text-sm"
                            >
                                Agendar
                            </button>
                            <button onClick={onClose} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold text-sm">Cancelar</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
