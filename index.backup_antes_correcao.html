<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSD - Sistema de Gestão Comercial</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fafafa; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: #f0f0f0; }
        .sidebar-item.active { background: #e8f5e9; border-left: 3px solid #4caf50; font-weight: 600; }
        .sortable-header { cursor: pointer; user-select: none; }
        .sortable-header:hover { background: #f5f5f5; }
        .kanban-column { min-height: 600px; background: #f8f9fa; border-radius: 12px; padding: 16px; }
        .contact-card { cursor: move; transition: all 0.2s; }
        .contact-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .contact-card.dragging { opacity: 0.5; }
        .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 4px; }
        .tag-urgente { background: #fee; color: #c00; }
        .tag-vip { background: #fef3c7; color: #92400e; }
        .tag-cold { background: #dbeafe; color: #1e40af; }
        .tag-quente { background: #fecaca; color: #991b1b; }
        .priority-high { border-left: 4px solid #ef4444 !important; }
        .priority-medium { border-left: 4px solid #f59e0b !important; }
        .priority-low { border-left: 4px solid #10b981 !important; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .notification-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 9999px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = '/api';
        
        const api = {
            from: (table) => ({
                select: async () => {
                    const token = localStorage.getItem('token');
                    const res = await fetch(API_URL + '/' + table, { headers: token ? {'Authorization': 'Bearer ' + token} : {} });
                    return {data: res.ok ? await res.json() : []};
                },
                insert: async (records) => {
                    const token = localStorage.getItem('token');
                    const arr = Array.isArray(records) ? records : [records];
                    for (const r of arr) {
                        await fetch(API_URL + '/' + table, { method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify(r) });
                    }
                },
                update: async (id, record) => {
                    const token = localStorage.getItem('token');
                    await fetch(API_URL + '/' + table + '/' + id, { method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify(record) });
                },
                delete: async (id) => {
                    const token = localStorage.getItem('token');
                    await fetch(API_URL + '/' + table + '/' + id, { method: 'DELETE', headers: {'Authorization': 'Bearer ' + token} });
                }
            })
        };

        const exportToExcel = (data, filename) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dados");
            XLSX.writeFile(wb, filename + ".xlsx");
        };

        const exportToPDF = (headers, rows, title, filename) => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text(title, 14, 15);
            doc.setFontSize(10);
            doc.text('GSD - Sistema de Gestão Comercial', 14, 22);
            doc.text('Data: ' + new Date().toLocaleDateString('pt-BR'), 14, 28);
            doc.autoTable({
                startY: 35,
                head: [headers],
                body: rows,
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [76, 175, 80], fontStyle: 'bold' }
            });
            doc.save(filename + ".pdf");
        };

        function App() {
            // 👤 USUÁRIO LOGADO (simulado - em produção viria do backend)
            const [usuarioLogado, setUsuarioLogado] = useState(() => {
                const saved = localStorage.getItem('usuarioLogado');
                console.log('🔍 Verificando usuário logado:', saved);
                return saved ? JSON.parse(saved) : null;
            });
            
            // 🔒 FUNÇÕES DE PERMISSÃO
            const temPermissao = (permissao) => {
                const permissoes = {
                    'admin': ['usuarios', 'metas', 'relatorios_completos', 'clientes', 'vendas_todas', 'configuracoes'],
                    'gerente': ['metas', 'relatorios_equipe', 'clientes', 'vendas_equipe', 'aprovar_vendas'],
                    'vendedor': ['relatorios_proprios', 'clientes', 'vendas_proprias', 'leads_proprios']
                };
                return permissoes[usuarioLogado.perfil]?.includes(permissao) || false;
            };
            
            const podeVerTodosDados = () => usuarioLogado && usuarioLogado.perfil === 'admin';
            const ehVendedor = () => usuarioLogado && usuarioLogado.perfil === 'vendedor';

            // const [user, setUser] = useState(null); // REMOVIDO - usando usuarioLogado
            const [page, setPage] = useState(() => {
                const last = localStorage.getItem('lastPage');
                if (last) {
                    localStorage.removeItem('lastPage');
                    return last;
                }
                return 'workspace';
            });
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(null);
            const [toast, setToast] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [data, setData] = useState({ usuarios: [], clientes: [], clientesFinais: [], vendedores: [], vendas: [], ligacoes: [] });

            useEffect(() => {
                const saved = localStorage.getItem('usuarioLogado');
                if (saved) {
                    console.log('✅ Usuário encontrado no localStorage:', JSON.parse(saved));
                    setUsuarioLogado(JSON.parse(saved));
                }
                loadData();
                
                // Verificar notificações a cada 30 segundos
                const interval = setInterval(checkNotifications, 30000);
                return () => clearInterval(interval);
            }, []);

            const loadData = async () => {
                const [u, c, cf, vd, v, l] = await Promise.all([
                    Promise.resolve({data: JSON.parse(localStorage.getItem('usuarios') || '[{"id":1,"nome":"Administrador","email":"admin@empresa.com","perfil":"admin","ativo":true}]')}),
                    api.from('clientes').select(), 
                    api.from('clientes_finais').select(),
                    api.from('vendedores').select(), 
                    api.from('vendas').select(), 
                    api.from('ligacoes').select()
                ]);
                const newData = { usuarios: u.data, clientes: c.data, clientesFinais: cf.data, vendedores: vd.data, vendas: v.data, ligacoes: l.data };
                // Filtrar dados baseado no perfil do usuário
                if (usuarioLogado && usuarioLogado.perfil === 'vendedor') {
                    newData.vendas = newData.vendas.filter(v => v.vendedor_id === usuarioLogado.id);
                    newData.ligacoes = newData.ligacoes.filter(l => l.vendedor_id === usuarioLogado.id);
                    newData.clientesFinais = newData.clientesFinais.filter(c => c.vendedor_id === usuarioLogado.id || c.criado_por === usuarioLogado.id);
                }
                
                // GERENTE vê apenas sua equipe
                if (usuarioLogado && usuarioLogado.perfil === 'gerente') {
                    const vendedoresDaEquipe = newData.usuarios.filter(u => u.gerente_id === usuarioLogado.id).map(u => u.id);
                    newData.vendas = newData.vendas.filter(v => vendedoresDaEquipe.includes(v.vendedor_id));
                    newData.ligacoes = newData.ligacoes.filter(l => vendedoresDaEquipe.includes(l.vendedor_id));
                    newData.clientesFinais = newData.clientesFinais.filter(c => vendedoresDaEquipe.includes(c.vendedor_id) || vendedoresDaEquipe.includes(c.criado_por));
                }
                setData(newData);
                setLoading(false);
                checkNotifications(cf.data);
            };

            const checkNotifications = (contatos = data.clientesFinais) => {
                const now = new Date();
                const newNotifications = [];
                
                contatos.forEach(c => {
                    // Verificar follow-ups pendentes
                    if (c.proximo_followup) {
                        const followupDate = new Date(c.proximo_followup);
                        const diff = followupDate - now;
                        const hoursUntil = diff / (1000 * 60 * 60);
                        
                        if (hoursUntil > 0 && hoursUntil < 2) {
                            newNotifications.push({
                                id: 'followup-' + c.id,
                                type: 'followup',
                                message: `Follow-up com ${c.nome} em ${Math.round(hoursUntil * 60)} minutos`,
                                contact: c,
                                urgent: hoursUntil < 0.5
                            });
                        }
                    }
                    
                    // Verificar leads quentes sem interação há muito tempo
                    if (c.status === 'interessado' || c.status === 'negociacao') {
                        if (c.ultima_interacao) {
                            const lastInteraction = new Date(c.ultima_interacao);
                            const daysSince = (now - lastInteraction) / (1000 * 60 * 60 * 24);
                            
                            if (daysSince > 3) {
                                newNotifications.push({
                                    id: 'cold-' + c.id,
                                    type: 'warning',
                                    message: `${c.nome} está há ${Math.round(daysSince)} dias sem contato!`,
                                    contact: c,
                                    urgent: daysSince > 7
                                });
                            }
                        }
                    }
                });
                
                setNotifications(newNotifications);
            };

            const showToast = (msg, type = 'success') => { 
                setToast({msg, type}); 
                setTimeout(() => setToast(null), 3000); 
            };

            const login = async (email, senha) => {
                console.log('🔐 LOGIN CHAMADO:', email);
                const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                console.log('📋 Usuários:', usuarios);
                const user = usuarios.find(u => u.email === email && u.senha === senha && u.ativo === true);
                console.log('👤 Usuário encontrado:', user);
                if (user) {
                    const safeUser = {...user};
                    delete safeUser.senha;
                    localStorage.setItem('usuarioLogado', JSON.stringify(safeUser));
                    console.log('✅ Login OK, recarregando...');
                    window.location.reload();
                    return true;
                }
                console.log('❌ Login falhou');
                return false;
            };

            const addCliente = async (form) => { await api.from('clientes').insert([form]); await loadData(); setShowModal(null); showToast('Cliente adicionado!'); };
            const editCliente = async (id, form) => { await api.from('clientes').update(id, form); await loadData(); setShowModal(null); showToast('Cliente atualizado!'); };
            const deleteCliente = async (id) => { await api.from('clientes').delete(id); await loadData(); showToast('Cliente excluído!'); };
            
            const addContato = async (form) => { 
                await api.from('clientes_finais').insert([{...form, status: 'novo', ultima_interacao: new Date().toISOString()}]); 
                await loadData(); 
                setShowModal(null); 
                showToast('Lead adicionado!'); 
            };
            
            const editContato = async (id, form) => { 
                await api.from('clientes_finais').update(id, {...form, ultima_interacao: new Date().toISOString()}); 
                await loadData(); 
                setShowModal(null); 
                showToast('Lead atualizado!'); 
            };
            
            const deleteContato = async (id) => { await api.from('clientes_finais').delete(id); await loadData(); showToast('Lead excluído!'); };
            
            const addVenda = async (form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                const comissao = parseFloat(form.valor_bruto) * (parseFloat(cliente.percentual_comissao) / 100);
                await api.from('vendas').insert([{ cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), valor_bruto: parseFloat(form.valor_bruto), valor_comissao: comissao, data: new Date().toISOString(), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, faturada: false }]);
                await loadData(); setShowModal(null); showToast('Venda registrada!', 'success');
            };
            
            const editVenda = async (id, form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                const comissao = parseFloat(form.valor_bruto) * (parseFloat(cliente.percentual_comissao) / 100);
                await api.from('vendas').update(id, { cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), valor_bruto: parseFloat(form.valor_bruto), valor_comissao: comissao, cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, faturada: form.faturada });
                await loadData(); setShowModal(null); showToast('Venda atualizada!');
            };
            
            const deleteVenda = async (id) => { await api.from('vendas').delete(id); await loadData(); showToast('Venda excluída!'); };

            const saveUsuario = async (userData) => {
                try {
                    const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                    
                    if (showModal.data?.id) {
                        // Editar usuário existente
                        const index = usuarios.findIndex(u => u.id === showModal.data.id);
                        if (index !== -1) {
                            usuarios[index] = { ...usuarios[index], ...userData };
                        }
                        showToast('Usuário atualizado com sucesso!');
                    } else {
                        // Criar novo usuário
                        const newId = usuarios.length > 0 ? Math.max(...usuarios.map(u => u.id)) + 1 : 2;
                        usuarios.push({
                            id: newId,
                            ...userData,
                            ultima_atividade: new Date().toISOString()
                        });
                        showToast('Usuário criado com sucesso!');
                    }
                    
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                    loadData();
                    setShowModal(null);
                } catch (error) {
                    showToast('Erro ao salvar usuário: ' + error.message, 'error');
                }
            };

            const deleteUsuario = async (id) => {
                try {
                    if (window.confirm('Tem certeza que deseja excluir este usuário?')) {
                        const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                        const filtered = usuarios.filter(u => u.id !== id);
                        localStorage.setItem('usuarios', JSON.stringify(filtered));
                        showToast('Usuário excluído com sucesso!');
                        loadData();
                    }
                } catch (error) {
                    showToast('Erro ao excluir usuário: ' + error.message, 'error');
                }
            };

            const addLigacao = async (form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                await api.from('ligacoes').insert([{ cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), data: new Date().toISOString(), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, status: form.status }]);
                
                // Atualizar última interação do contato
                const contato = data.clientesFinais.find(c => c.cliente_primario_id === parseInt(form.cliente_id));
                if (contato) {
                    await api.from('clientes_finais').update(contato.id, { ultima_interacao: new Date().toISOString() });
                }
                
                await loadData(); 
                setShowModal(null); 
                showToast('Atividade registrada!');
            };
            
            const editLigacao = async (id, form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                await api.from('ligacoes').update(id, { cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, status: form.status });
                await loadData(); setShowModal(null); showToast('Atividade atualizada!');
            };
            
            const deleteLigacao = async (id) => { await api.from('ligacoes').delete(id); await loadData(); showToast('Atividade excluída!'); };

            
            // Função para baixar modelo Excel
            const baixarModelo = (tipo) => {
                let dados = [];
                let nomeArquivo = '';
                
                if (tipo === 'clientes_finais') {
                    dados = [
                        {
                            'Nome': 'João Silva',
                            'Telefone': '11987654321',
                            'Email': 'joao@email.com',
                            'Cargo': 'Gerente',
                            'Empresa': 'Empresa ABC',
                            'Status': 'novo',
                            'Observacoes': 'Cliente em potencial'
                        },
                        {
                            'Nome': 'Maria Santos',
                            'Telefone': '11976543210',
                            'Email': 'maria@email.com',
                            'Cargo': 'Diretora',
                            'Empresa': 'Empresa XYZ',
                            'Status': 'contato',
                            'Observacoes': ''
                        }
                    ];
                    nomeArquivo = 'Modelo_Clientes_Finais.xlsx';
                } else {
                    dados = [
                        {
                            'Nome da Empresa': 'Empresa ABC LTDA',
                            'CNPJ': '12.345.678/0001-90',
                            'Telefone': '1133334444',
                            'Email': 'contato@empresaabc.com',
                            'Segmento': 'Tecnologia',
                            'Porte': 'Médio',
                            'Observacoes': 'Cliente corporativo'
                        },
                        {
                            'Nome da Empresa': 'Tech Solutions S/A',
                            'CNPJ': '98.765.432/0001-10',
                            'Telefone': '1155556666',
                            'Email': 'vendas@techsolutions.com',
                            'Segmento': 'Consultoria',
                            'Porte': 'Grande',
                            'Observacoes': ''
                        }
                    ];
                    nomeArquivo = 'Modelo_Clientes_B2B.xlsx';
                }
                
                const ws = XLSX.utils.json_to_sheet(dados);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Modelo');
                XLSX.writeFile(wb, nomeArquivo);
                showToast('📥 Modelo baixado com sucesso!');
            };

            const importExcel = async (file) => {
                console.log('🚀 Iniciando importação do arquivo:', file.name);
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        let json = [];
                        
                        // Detectar tipo de arquivo
                        if (file.name.endsWith('.csv')) {
                            // Processar CSV
                            const text = e.target.result;
                            const lines = text.split('\n');
                            const headers = lines[0].split(/[,;]/);
                            json = lines.slice(1).filter(line => line.trim()).map(line => {
                                const values = line.split(/[,;]/);
                                const obj = {};
                                headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim() || '');
                                return obj;
                            });
                        } else {
                            // Processar Excel
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, {type: 'array'});
                            const sheet = workbook.Sheets[workbook.SheetNames[0]];
                            json = XLSX.utils.sheet_to_json(sheet);
                        }
                        
                        console.log('📊 Total de linhas:', json.length);
                        
                        // Buscar existentes da API
                        const existentesResp = await api.from('clientes_finais').select();
                        const existentes = existentesResp.data || [];
                        
                        let importados = 0;
                        let duplicados = 0;
                        let erros = 0;
                        const novosContatos = [];
                        
                        for (const row of json) {
                            const telefone = (row.Telefone || row.telefone || '').replace(/\D/g, '');
                            const nome = row.Nome || row.nome || '';
                            
                            // Validar campos obrigatórios
                            if (!nome || !telefone) {
                                erros++;
                                console.log('❌ Registro inválido:', row);
                                continue;
                            }
                            
                            // Verificar duplicados por telefone
                            const existe = existentes.find(c => c.telefone?.replace(/\D/g, '') === telefone);
                            if (existe) {
                                duplicados++;
                                console.log('⚠️ Duplicado:', telefone);
                                continue;
                            }
                            
                            const novoContato = {
                                nome: nome,
                                telefone: telefone,
                                whatsapp: row.WhatsApp || row.whatsapp || telefone,
                                email: row.Email || row.email || '',
                                cargo: row.Cargo || row.cargo || '',
                                cliente_primario_id: null,
                                vendedor_id: usuarioLogado?.id || null,
                                criado_por: usuarioLogado?.id || null,
                                status: row.Status || row.status || 'novo',
                                notas: row.Observacoes || row.observacoes || row.Notas || row.notas || '',
                                ultima_interacao: new Date().toISOString(),
                                data_criacao: new Date().toISOString()
                            };
                            
                            novosContatos.push(novoContato);
                            importados++;
                            console.log('✅ Preparado para importar:', novoContato.nome);
                        }
                        
                        // SALVAR NA API (não no localStorage)
                        if (novosContatos.length > 0) {
                            console.log('💾 Salvando na API:', novosContatos.length, 'registros');
                            await api.from('clientes_finais').insert(novosContatos);
                        }
                        
                        setShowModal(null);
                        
                        // Recarregar dados da API
                        await loadData();
                        
                        showToast(`✅ Importados: ${importados} | ⚠️ Duplicados: ${duplicados}` + (erros > 0 ? ` | ❌ Erros: ${erros}` : ''));
                        
                    } catch (err) {
                        console.error('❌ Erro ao importar:', err);
                        showToast('❌ Erro ao importar arquivo!', 'error');
                    }
                };
                
                if (file.name.endsWith('.csv')) {
                    reader.readAsText(file);
                } else {
                    reader.readAsArrayBuffer(file);
                }
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!usuarioLogado) return <Login onLogin={login} />;

            const kpis = { 
                faturamento: data.vendas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0),

        // ========================================
        // 🔐 COMPONENTE DE AUTENTICAÇÃO (3 TELAS)
        // ========================================
        function AuthScreens({ onLogin }) {
            const [tela, setTela] = React.useState('login');
            const [email, setEmail] = React.useState('');
            const [senha, setSenha] = React.useState('');
            const [nome, setNome] = React.useState('');
            const [telefone, setTelefone] = React.useState('');
            const [erro, setErro] = React.useState('');
            const [msg, setMsg] = React.useState('');
            
            const handleLogin = async (e) => {
                e.preventDefault();
                const ok = await onLogin(email, senha);
                if (!ok) setErro('Email ou senha incorretos');
            };
            
            const handleRecuperarSenha = (e) => {
                e.preventDefault();
                let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                if (!usuarios.find(u => u.perfil === 'admin')) {
                    usuarios.push({id: 1, nome: 'Administrador', email: 'admin@empresa.com', senha: 'admin123', perfil: 'admin', ativo: true, aprovado: true});
                    localStorage.setItem('usuarios', JSON.stringify(usuarios));
                }
                const user = usuarios.find(u => u.email === email);
                if (user) setMsg('Sua senha é: ' + user.senha);
                else setMsg('Email não encontrado!');
            };
            
            const handleCriarConta = (e) => {
                e.preventDefault();
                const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
                if (usuarios.find(u => u.email === email)) {
                    setErro('Email já cadastrado!');
                    return;
                }
                const newId = usuarios.length > 0 ? Math.max(...usuarios.map(u => u.id)) + 1 : 2;
                usuarios.push({id: newId, nome, email, telefone, senha, perfil: 'vendedor', ativo: false, aprovado: false, data_solicitacao: new Date().toISOString()});
                localStorage.setItem('usuarios', JSON.stringify(usuarios));
                alert('✅ Cadastro enviado!\n\nAguarde aprovação do administrador.');
                setTela('login');
            };
            
            if (tela === 'esqueci') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center p-4">

                                <p className="text-gray-600 text-sm">Digite seu email cadastrado</p>
                            </div>

                                <div><label className="block text-xs font-medium mb-2 text-gray-700">Email</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 border rounded-lg text-sm" required /></div>
                                {msg && <div className="bg-blue-50 text-blue-800 px-4 py-3 rounded-lg text-xs font-medium">{msg}</div>}
                                <button type="submit" className="w-full bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600 text-sm">📧 Recuperar Senha</button>
                                <button type="button" onClick={() => {setTela('login'); setMsg(''); setEmail('');}} className="w-full border-2 text-gray-600 py-3 rounded-lg font-semibold hover:bg-gray-50 text-sm">← Voltar</button>
                            </form>
                        </div>
                    </div>
                );
            }
            
            if (tela === 'cadastro') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-400 to-pink-600 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">

                                <div><label className="block text-xs font-medium mb-2 text-gray-700">Email *</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 border rounded-lg text-sm" required /></div>

            else if (dias < 7) score += 10;
            else if (dias >= 7) score -= 10;

tradas.length} vendas encontradas</div></div><div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"><table className="w-full"><thead className="bg-gray-50 border-b border-gray-200"><tr><th onClick={() => alternarOrdenacao('cliente_nome')} className="sortable-header px-6 py-3 text-left" style={{fontSize: '11px'}}><div className="flex items-center gap-1 font-semibold text-gray-600 uppercase">Cliente {ordenacao.campo === 'cliente_nome' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th onClick={() => alternarOrdenacao('vendedor_nome')} className="sortable-header px-6 py-3 text-left" style={{fontSize: '11px'}}><div className="flex items-center gap-1 font-semibold text-gray-600 uppercase">Vendedor {ordenacao.campo === 'vendedor_nome' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th onClick={() => alternarOrdenacao('valor_bruto')} className="sortable-header px-6 py-3 text-right" style={{fontSize: '11px'}}><div className="flex items-center justify-end gap-1 font-semibold text-gray-600 uppercase">Valor {ordenacao.campo === 'valor_bruto' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th onClick={() => alternarOrdenacao('faturada')} className="sortable-header px-6 py-3 text-center" style={{fontSize: '11px'}}><div className="flex items-center justify-center gap-1 font-semibold text-gray-600 uppercase">Status {ordenacao.campo === 'faturada' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th className="px-6 py-3 text-center" style={{fontSize: '11px'}}><div className="font-semibold text-gray-600 uppercase">Ações</div></th></tr></thead><tbody className="divide-y divide-gray-100">{vendasPaginadas.map(v => (<tr key={v.id} className="hover:bg-gray-50"><td className="px-6 py-4"><span style={{fontSize: '13px'}} className="font-medium text-gray-900">{v.cliente_nome}</span></td><td className="px-6 py-4"><span style={{fontSize: '12px'}} className="text-gray-600">{v.ven         function Atividades({ ligacoes, vendedores, clientes, showToast, onEdit, onDelete }) {
            const [busca, setBusca] = useState('');
            const [filtroVendedor, setFiltroVendedor] = useState('');
            const [filtroStatus, setFiltroStatus] = useState('');
            const [ordenacao, setOrdenacao] = useState({ campo: 'data', direcao: 'desc' });

            let ligacoesFiltradas = ligacoes.filter(l => {
                const buscaMatch = busca === '' || l.cliente_nome.toLowerCase().includes(busca.toLowerCase()) || l.vendedor_nome.toLowerCase().includes(busca.toLowerCase());
                const vendedorMatch = filtroVendedor === '' || l.vendedor_id === parseInt(filtroVendedor);
                const statusMatch = filtroStatus === '' || l.status === filtroStatus;
                return buscaMatch && vendedorMatch && statusMatch;
            });

            ligacoesFiltradas.sort((a, b) => {
                let valA = a[ordenacao.campo];
                let valB = b[ordenacao.campo];
                if (valA < valB) return ordenacao.direcao === 'asc' ? -1 : 1;
                if (valA > valB) return ordenacao.direcao === 'asc' ? 1 : -1;
                return 0;
            });

            const alternarOrdenacao = (campo) => {
                if (ordenacao.campo === campo) {
                    setOrdenacao({ campo, direcao: ordenacao.direcao === 'asc' ? 'desc' : 'asc' });
                } else {
                    setOrdenacao({ campo, direcao: 'asc' });
                }
            };

            const exportarExcel = () => {
                const dados = ligacoesFiltradas.map(l => ({
                    Cliente: l.cliente_nome,
                    Vendedor: l.vendedor_nome,
                    Status: l.status === 'efetivada' ? 'Efetivada' : 'Tentada',
                    Data: new Date(l.data).toLocaleDateString('pt-BR')
                }));
                exportToExcel(dados, 'Atividades_' + new Date().toISOString().split('T')[0]);
                showToast('Excel exportado com sucesso!');
            };

            const exportarPDF = () => {
                const headers = ['Cliente', 'Vendedor', 'Status', 'Data'];
                const rows = ligacoesFiltradas.map(l => [
                    l.cliente_nome,
                    l.vendedor_nome,
                    l.status === 'efetivada' ? 'Efetivada' : 'Tentada',
                    new Date(l.data).toLocaleDateString('pt-BR')
                ]);
                exportToPDF(headers, rows, 'Relatório de Atividades', 'Atividades_' + new Date().toISOString().split('T')[0]);
                showToast('PDF exportado com sucesso!');
            };

            const handleDelete = (id) => {
                if (window.confirm('Tem certeza que deseja excluir esta atividade?')) {
                    onDelete(id);

        function ModalImport({ onImport, onClose }) { 
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [validacao, setValidacao] = useState(null);
            
            // Função para baixar modelo Excel
            const baixarModelo = () => {
                const dados = [
                    {
                        'Nome': 'João Silva',
                        'Telefone': '11987654321',
                        'Email': 'joao@email.com',
                        'Cargo': 'Gerente',
                        'Empresa': 'Empresa ABC',
                        'Status': 'novo',
                        'Observacoes': 'Cliente em potencial'
                    },
                    {
                        'Nome': 'Maria Santos',
                        'Telefone': '11976543210',
                        'Email': 'maria@email.com',
                        'Cargo': 'Diretora',
                        'Empresa': 'Empresa XYZ',
                        'Status': 'contato',
                        'Observacoes': ''
                    }
                ];
                
                const ws = XLSX.utils.json_to_sheet(dados);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Modelo');
                XLSX.writeFile(wb, 'Modelo_Clientes_Finais.xlsx');
            };
            
            // Função para validar dados
            const validarDados = (dados) => {
                const validacoes = [];
                const telefonesDuplicados = [];
                const telefonesExistentes = JSON.parse(localStorage.getItem('clientesFinais') || '[]').map(c => c.telefone?.replace(/\D/g, ''));
                
                dados.forEach((row, idx) => {
                    const erros = [];
                    const avisos = [];
                    
                    // Validar Nome
                    if (!row.Nome && !row.nome) {
                        erros.push('Nome obrigatório');
                    }
                    
                    // Validar Telefone
                    const tel = (row.Telefone || row.telefone || '').replace(/\D/g, '');
                    if (!tel) {
                        erros.push('Telefone obrigatório');
                    } else if (tel.length < 10 || tel.length > 11) {
                        erros.push('Telefone inválido (deve ter 10 ou 11 dígitos)');
                    }
                    
                    // Verificar duplicados na planilha
                    if (tel && telefonesDuplicados.includes(tel)) {
                        avisos.push('Telefone duplicado na planilha');
                    } else if (tel) {
                        telefonesDuplicados.push(tel);
                    }
                    
                    // Verificar se já existe no sistema
                    if (tel && telefonesExistentes.includes(tel)) {
                        avisos.push('Telefone já existe no sistema');
                    }
                    
                    // Validar Email
                    const email = row.Email || row.email || '';
                    if (email && !email.match(/^[^@]+@[^@]+\.[^@]+$/)) {
                        erros.push('Email inválido');
                    }
                    
                    validacoes.push({
                        linha: idx + 2, // +2 porque linha 1 é header
                        dados: row,
                        erros: erros,
                        avisos: avisos,
                        valido: erros.length === 0
                    });
                });
                
                return validacoes;
            };
            
            // Processar arquivo para preview
            const processarArquivo = (arquivo) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        console.log('📂 Processando arquivo:', arquivo.name);
                        let json = [];
                        
                        if (arquivo.name.endsWith('.csv')) {
                            const text = e.target.result;
                            const lines = text.split('\n');
                            const headers = lines[0].split(/[,;]/);
                            json = lines.slice(1).filter(line => line.trim()).map(line => {
                                const values = line.split(/[,;]/);
                                const obj = {};
                                headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim() || '');
                                return obj;
                            });
                        } else {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, {type: 'array'});
                            const sheet = workbook.Sheets[workbook.SheetNames[0]];
                            json = XLSX.utils.sheet_to_json(sheet);
                        }
                        
                        console.log('📊 Dados extraídos:', json);
                        const validacoes = validarDados(json);
                        console.log('✅ Validações:', validacoes);
                        setPreview(json);
                        setValidacao(validacoes);
                    } catch (err) {
                        console.error('Erro ao processar arquivo:', err);
                        // Mostrar erro no estado em vez de alert
                        setValidacao([{
                            linha: 0,
                            dados: {},
                            erros: ['Erro ao processar arquivo: ' + err.message],
                            avisos: [],
                            valido: false
                        }]);
                        setPreview([]);
                    }
                };
                
                if (arquivo.name.endsWith('.csv')) {
                    reader.readAsText(arquivo);
                } else {
                    reader.readAsArrayBuffer(arquivo);
                }
            };
            
            // Quando seleciona arquivo
            const handleFileChange = (e) => {
                const arquivo = e.target.files[0];
                setFile(arquivo);
                if (arquivo) {
                    processarArquivo(arquivo);
                }
            }; 
            // Se não tem preview, mostrar tela de upload
            if (!preview) {
                return (
                    <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} onClick={onClose}>
                        <div style={{background: 'white', borderRadius: '16px', padding: '32px', maxWidth: '400px', width: '100%', margin: '16px'}} onClick={(e) => e.stopPropagation()}>
                            <h2 className="text-xl font-bold mb-4">Importar Clientes</h2>
                            <button onClick={baixarModelo} className="w-full bg-blue-100 border-2 border-blue-300 text-blue-700 py-2 rounded-lg font-medium text-sm mb-4 hover:bg-blue-200">
                                📥 Baixar Modelo Excel
                            </button>
                            <div className="border-4 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-green-500 cursor-pointer" onClick={() => document.getElementById('fileInput').click()}>
                                <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFileChange} className="hidden" id="fileInput" />
                                <div className="text-5xl mb-4">📊</div>
                                <div style={{fontSize: '12px'}} className="text-gray-600 mb-2">Clique para selecionar arquivo</div>
                                <div style={{fontSize: '11px'}} className="text-gray-500 mt-1">Excel (.xlsx, .xls) ou CSV</div>
                                {file && <div style={{fontSize: '11px'}} className="font-semibold text-green-600 mt-3">{file.name}</div>}
                            </div>
                            <button onClick={onClose} className="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold text-sm mt-4">Cancelar</button>
                        </div>
                    </div>
                );
            }
            
            // Mostrar preview com validação
            if (!validacao || validacao.length === 0) {
                return (
                    <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} onClick={onClose}>

function Metas({ vendedores, vendas, ligacoes, showToast, usuarioLogado }) {
    const [selectedVendedor, setSelectedVendedor] = useState('');
    const [metaDiaria, setMetaDiaria] = useState(15);
    const [metaMensal, setMetaMensal] = useState(50000);
    
    // Filtrar vendedores baseado no perfil
    const vendedoresFiltrados = usuarioLogado?.perfil === 'vendedor'
        ? vendedores.filter(v => v.id === usuarioLogado.id)
        : usuarioLogado?.perfil === 'gerente'
        ? vendedores.filter(v => v.gerente_id === usuarioLogado.id)
        : vendedores;
    
    const salvarMeta = () => {
        if (!selectedVendedor) {
            showToast('Selecione um vendedor!', 'error');
            return;
        }
        localStorage.setItem('meta_' + selectedVendedor, JSON.stringify({
            diaria: metaDiaria, 
            mensal: metaMensal,
            data: new Date().toISOString()
        }));
        showToast('Meta salva com sucesso!');
        setSelectedVendedor('');
    };
    
    const hoje = new Date().toDateString();
    const mesAtual = new Date().getMonth();
    
    return (
        <div className="space-y-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border">
                <h2 className="text-2xl font-bold mb-6">🎯 Definir Metas por Vendedor</h2>
                <div className="grid grid-cols-3 gap-4">
                    <div>
                        <label className="block text-sm font-medium mb-2 text-gray-700">Vendedor</label>
                        <select value={selectedVendedor} onChange={(e) => setSelectedVendedor(e.target.value)} className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500">
                            <option value="">Selecione...</option>
                            {vendedores.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-medium mb-2 text-gray-700">Meta Diária (ligações)</label>
                        <input type="number" value={metaDiaria} onChange={(e) => setMetaDiaria(parseInt(e.target.value))} className="w-full px-4 py-3 border rounded-lg" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium mb-2 text-gray-700">Meta Mensal (R$)</label>
                        <input type="number" value={metaMensal} onChange={(e) => setMetaMensal(parseInt(e.target.value))} className="w-full px-4 py-3 border rounded-lg" />
                    </div>
                </div>
                <button onClick={salvarMeta} className="mt-6 px-8 py-3 bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold">💾 Salvar Meta</button>
            </div>
            
            <div className="grid grid-cols-3 gap-4">
                {vendedoresFiltrados.map(v => {
                    const meta = JSON.parse(localStorage.getItem('meta_' + v.id) || '{"diaria":0,"mensal":0}');
                    const ligacoesHoje = ligacoes.filter(l => l.vendedor_id === v.id && new Date(l.data).toDateString() === hoje).length;
                    const vendasMes = vendas.filter(vd => vd.vendedor_id === v.id && new Date(vd.data).getMonth() === mesAtual);
                    const faturamentoMes = vendasMes.reduce((s, vd) => s + parseFloat(vd.valor_bruto || 0), 0);
                    const progressoDiario = meta.diaria > 0 ? (ligacoesHoje / meta.diaria) * 100 : 0;
                    const progressoMensal = meta.mensal > 0 ? (faturamentoMes / meta.mensal) * 100 : 0;
                    
                    return (
                        <div key={v.id} className="bg-white p-6 rounded-xl shadow-lg border-2">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold text-xl">{v.nome.charAt(0)}</div>
                                <div><h3 className="font-bold text-lg">{v.nome}</h3><p className="text-xs text-gray-500">Performance</p></div>
                            </div>
                            <div className="mb-4">
                                <div className="flex justify-between mb-2"><span className="text-sm font-medium">Ligações Hoje</span><span className="text-sm font-bold">{ligacoesHoje} / {meta.diaria}</span></div>
                                <div className="w-full bg-gray-200 rounded-full h-3"><div className={'h-3 rounded-full ' + (progressoDiario >= 100 ? 'bg-green-500' : 'bg-blue-500')} style={{width: Math.min(progressoDiario, 100) + '%'}}></div></div>
                                <p className="text-xs text-gray-500 mt-1">{progressoDiario.toFixed(0)}% da meta</p>
                            </div>
                            <div>
                                <div className="flex justify-between mb-2"><span className="text-sm font-medium">Faturamento Mês</span><span className="text-sm font-bold">R$ {faturamentoMes.toLocaleString('pt-BR')}</span></div>
                                <div className="w-full bg-gray-200 rounded-full h-3"><div className={'h-3 rounded-full ' + (progressoMensal >= 100 ? 'bg-green-500' : 'bg-orange-500')} style={{width: Math.min(progressoMensal, 100) + '%'}}></div></div>
                                <p className="text-xs text-gray-500 mt-1">{progressoMensal.toFixed(0)}% da meta (R$ {meta.mensal.toLocaleString('pt-BR')})</p>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

                        <input type="date" value={periodoFim} onChange={(e) => setPeriodoFim(e.target.value)} className="w-full px-2 py-1 text-[10px] border rounded focus:ring-1 focus:ring-green-500" />
                    </div>
                    <div>
                        <label className="block text-[10px] font-medium text-gray-600 mb-1">Vendedor</label>
                        <select value={vendedorSelecionado} onChange={(e) => setVendedorSelecionado(e.target.value)} className="w-full px-2 py-1 text-[10px] border rounded focus:ring-1 focus:ring-green-500">
                            <option value="todos">Todos</option>
                            {vendedoresBase.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
                        </select>
                    </div>
                    <div>
                        <label className="block text-[10px] font-medium text-gray-600 mb-1">Dia Semana</label>
                        <select value={diaSemana} onChange={(e) => setDiaSemana(e.target.value)} className="w-full px-2 py-1 text-[10px] border rounded focus:ring-1 focus:ring-green-500">
                            <option value="todos">Todos</option>
                            <option value="0">Domingo</option>
                            <option value="1">Segunda</option>
                            <option value="2">Terça</option>
                            <option value="3">Quarta</option>
                            <option value="4">Quinta</option>
                            <option value="5">Sexta</option>
                            <option value="6">Sábado</option>
                        </select>
                    </div>
                    <div>
                        <label className="block text-[10px] font-medium text-gray-600 mb-1">Região</label>
                        <select value={regiao} onChange={(e) => setRegiao(e.target.value)} className="w-full px-2 py-1 text-[10px] border rounded focus:ring-1 focus:ring-green-500">
                            <option value="todas">Todas</option>
                            <option value="sudeste">Sudeste</option>
                            <option value="sul">Sul</option>
                            <option value="nordeste">Nordeste</option>
                            <option value="norte">Norte</option>
                            <option value="centro-oeste">Centro-Oeste</option>
                        </select>
                    </div>
                    <div>
                        <label className="block text-[10px] font-medium text-gray-600 mb-1">Rápido</label>
                        <div className="flex gap-1">
                            <button onClick={() => { const h = new Date(); setPeriodoInicio(h.toISOString().split('T')[0]); setPeriodoFim(h.toISOString().split('T')[0]); }} className="flex-1 text-[9px] px-1 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded font-medium">Hoje</button>
                            <button onClick={() => { const h = new Date(); const d = new Date(h); d.setDate(d.getDate() - 7); setPeriodoInicio(d.toISOString().split('T')[0]); }} className="flex-1 text-[9px] px-1 py-1 bg-green-50 hover:bg-green-100 text-green-700 rounded font-medium">7d</button>
                        </div>
                    </div>
                </div>
            </div>
        </>
    );
    
    // Função para calcular dados
    const calcularDados = () => {
        const hoje = new Date();
        const dataInicio = new Date(periodoInicio + 'T00:00:00');
        const dataFim = new Date(periodoFim + 'T23:59:59');
        
        let vendasFiltradas = vendasBase.filter(v => {
            const dataVenda = new Date(v.data);
            if (dataVenda < dataInicio || dataVenda > dataFim) return false;
            if (vendedorSelecionado !== 'todos' && v.vendedor_id !== parseInt(vendedorSelecionado)) return false;
            if (diaSemana !== 'todos' && dataVenda.getDay() !== parseInt(diaSemana)) return false;
            return true;
        });
        
        let clientesFiltrados = clientesFinais.filter(c => {
            if (regiao !== 'todas' && c.telefone) {
                const ddd = c.telefone.replace(/\D/g, '').substring(0, 2);
                const regioes = {
                    'sudeste': ['11','12','13','14','15','16','17','18','19','21','22','24','27','28','31','32','33','34','35','37','38'],
                    'sul': ['41','42','43','44','45','46','47','48','49','51','53','54','55'],
                    'nordeste': ['71','73','74','75','77','79','81','82','83','84','85','86','87','88','89','98','99'],
                    'norte': ['63','65','66','67','68','69','91','92','93','94','95','96','97'],
                    'centro-oeste': ['61','62','64']
                };
                if (!regioes[regiao]?.includes(ddd)) return false;
            }
            return true;
        });
        
        const totalLeads = clientesFiltrados.length;
        const totalVendas = vendasFiltradas.length;
        const faturamentoTotal = vendasFiltradas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0);
        const ticketMedio = totalVendas > 0 ? faturamentoTotal / totalVendas : 0;
        const taxaConversao = totalLeads > 0 ? (totalVendas / totalLeads) * 100 : 0;
        
        const diasPeriodo = Math.ceil((dataFim - dataInicio) / (1000 * 60 * 60 * 24)) || 1;
        const dataInicioComp = new Date(dataInicio);
        dataInicioComp.setDate(dataInicioComp.getDate() - diasPeriodo);
        const vendasComp = vendasBase.filter(v => new Date(v.data) >= dataInicioComp && new Date(v.data) < dataInicio);
        const faturamentoComp = vendasComp.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0);
        const crescimento = faturamentoComp > 0 ? ((faturamentoTotal - faturamentoComp) / faturamentoComp) * 100 : 0;
        
        const tresDias = new Date(hoje.getTime() - 3 * 24 * 60 * 60 * 1000);
        const leadsSemFollowup = clientesFiltrados.filter(c => {
            const ultima = c.ultima_interacao ? new Date(c.ultima_interacao) : null;
            return !ultima || ultima < tresDias;
        }).length;
        
        let healthScore = 0;
        if (taxaConversao > 20) healthScore += 30; else if (taxaConversao > 10) healthScore += 15;
        if (crescimento > 10) healthScore += 25; else if (crescimento > 0) healthScore += 15;
        if (leadsSemFollowup < totalLeads * 0.2) healthScore += 25; else if (leadsSemFollowup < totalLeads * 0.4) healthScore += 15;
        if (totalVendas > 0) healthScore += 20;
        const healthColor = healthScore >= 75 ? 'green' : healthScore >= 50 ? 'yellow' : 'red';
        
        const performanceVendedores = vendedoresBase.map(v => {
            const vendasV = vendasFiltradas.filter(vd => vd.vendedor_id === v.id);
            const faturamento = vendasV.reduce((s, vd) => s + parseFloat(vd.valor_bruto || 0), 0);
            return { id: v.id, nome: v.nome, vendas: vendasV.length, faturamento, ticketMedio: vendasV.length > 0 ? faturamento / vendasV.length : 0 };
        }).sort((a, b) => b.faturamento - a.faturamento);
        
        const top3 = performanceVendedores.slice(0, 3);
        const bottom3 = performanceVendedores.slice(-3).reverse();
        
        const leadsStatus = {
            novo: clientesFiltrados.filter(c => c.status === 'novo').length,
            interessado: clientesFiltrados.filter(c => c.status === 'interessado').length,
            negociacao: clientesFiltrados.filter(c => c.status === 'negociacao').length,
            fechado: clientesFiltrados.filter(c => c.status === 'fechado').length,
        };
        
        const vendasPorDia = [0,0,0,0,0,0,0];
        vendasFiltradas.forEach(v => { vendasPorDia[new Date(v.data).getDay()]++; });
        const melhorDia = vendasPorDia.indexOf(Math.max(...vendasPorDia));
        const diasSemana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        
        const alertas = [];
        if (leadsSemFollowup > totalLeads * 0.3) alertas.push({ tipo: 'erro', msg: leadsSemFollowup + ' leads sem follow-up há 3+ dias' });
        if (taxaConversao < 10) alertas.push({ tipo: 'aviso', msg: 'Taxa baixa: ' + taxaConversao.toFixed(1) + '%' });
        if (crescimento < -10) alertas.push({ tipo: 'erro', msg: 'Queda de ' + Math.abs(crescimento).toFixed(1) + '%' });
        
        return {
            vendasFiltradas, clientesFiltrados, totalLeads, totalVendas, faturamentoTotal,
            ticketMedio, taxaConversao, diasPeriodo, crescimento, leadsSemFollowup,
            healthScore, healthColor, performanceVendedores, top3, bottom3,
            leadsStatus, vendasPorDia, melhorDia, diasSemana, alertas
        };
    };
    
    const dados = calcularDados();
    
    // RENDERIZAR RELATÓRIO ESPECÍFICO
    let conteudoRelatorio = null;
    
    // DASHBOARD COMPLETO - Layout completo como já existe
    if (relatorioAtivo === 'dashboard') {
        conteudoRelatorio = (

                    <div className="flex items-center justify-between mb-2">
                        <h2 className="text-xs font-bold">📊 Resumo Executivo</h2>
                        <div className="text-[8px] bg-white/10 px-2 py-0.5 rounded-full">{dados.diasPeriodo} dias</div>
                    </div>
                    <div className="grid grid-cols-6 gap-2">
                        <div className="text-center bg-white/5 p-2 rounded">
                            <div className={'text-xl font-bold ' + (dados.healthColor === 'green' ? 'text-green-400' : dados.healthColor === 'yellow' ? 'text-yellow-400' : 'text-red-400')}>{dados.healthScore}</div>
                            <div className="text-[8px] opacity-75">Health</div>
                        </div>
                        <div className="text-center bg-white/5 p-2 rounded">
                            <div className="text-sm font-bold">{fmt(dados.faturamentoTotal)}</div>
                            <div className="text-[8px] opacity-75">Faturamento</div>
                            <div className={'text-[7px] ' + (dados.crescimento >= 0 ? 'text-green-400' : 'text-red-400')}>{dados.crescimento >= 0 ? '↗' : '↘'} {Math.abs(dados.crescimento).toFixed(1)}%</div>
                        </div>
                        <div className="text-center bg-white/5 p-2 rounded">
                            <div className="text-sm font-bold">{dados.totalVendas}</div>
                            <div className="text-[8px] opacity-75">Vendas</div>
                        </div>
                        <div className="text-center bg-white/5 p-2 rounded">
                            <div className="text-sm font-bold">{dados.taxaConversao.toFixed(1)}%</div>
                            <div className="text-[8px] opacity-75">Conversão</div>
                        </div>
                        <div className="text-center bg-white/5 p-2 rounded">
                            <div className="text-sm font-bold">{fmt(dados.ticketMedio)}</div>
                            <div className="text-[8px] opacity-75">Ticket</div>
                        </div>
                        <div className="text-center bg-white/5 p-2 rounded">
                            <div className={'text-sm font-bold ' + (dados.leadsSemFollowup > dados.totalLeads * 0.3 ? 'text-red-400' : 'text-green-400')}>{dados.leadsSemFollowup}</div>
                            <div className="text-[8px] opacity-75">Sem Follow</div>
                        </div>
                    </div>
                </div>

                {dados.alertas.length > 0 && (
                    <div className="bg-white p-2 rounded-lg shadow-sm border-l-2 border-orange-400">
                        <h3 className="text-xs font-bold text-gray-700 mb-2">🚨 Alertas</h3>
                        <div className="space-y-1">
                            {dados.alertas.map((a, i) => (
                                <div key={i} className={'p-1.5 rounded text-[9px] ' + (a.tipo === 'erro' ? 'bg-red-50 text-red-700' : 'bg-yellow-50 text-yellow-700')}>{a.msg}</div>
                            ))}
                        </div>
                    </div>
                )}

                <div className="grid grid-cols-2 gap-2">
                    <div className="bg-white p-2 rounded-lg shadow-sm border">
                        <h3 className="text-xs font-bold mb-2">🏆 Top 3</h3>
                        <div className="space-y-1">
                            {dados.top3.map((v, i) => (
                                <div key={i} className="flex items-center gap-2 p-1.5 bg-green-50 rounded">
                                    <div className="text-xs font-bold text-green-600">#{i+1}</div>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-[9px] font-bold truncate">{v.nome}</div>
                                        <div className="text-[8px] text-gray-500">{v.vendas} vendas</div>
                                    </div>
                                    <div className="text-[9px] font-bold text-green-600">{fmt(v.faturamento)}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white p-2 rounded-lg shadow-sm border">
                        <h3 className="text-xs font-bold mb-2">💡 Melhor Dia</h3>
                        <div className="text-center">
                            <div className="text-lg font-bold text-green-600">{dados.diasSemana[dados.melhorDia]}</div>
                            <div className="text-[8px] text-gray-500">{dados.vendasPorDia[dados.melhorDia]} vendas</div>
                            <div className="mt-2 grid grid-cols-7 gap-0.5">
                                {dados.diasSemana.map((dia, i) => (
                                    <div key={i} className={'text-center p-1 rounded ' + (i === dados.melhorDia ? 'bg-green-100' : 'bg-gray-50')}>
                                        <div className="text-[7px]">{dia}</div>
                                        <div className="text-[9px] font-bold">{dados.vendasPorDia[i]}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>

                <div className="bg-white p-2 rounded-lg shadow-sm border">
                    <h3 className="text-xs font-bold mb-2">🔄 Funil</h3>
                    <div className="flex gap-1.5">
                        {[
                            { label: 'Novos', value: dados.leadsStatus.novo, color: 'blue' },
                            { label: 'Interessados', value: dados.leadsStatus.interessado, color: 'indigo' },
                            { label: 'Negociação', value: dados.leadsStatus.negociacao, color: 'purple' },
                            { label: 'Fechados', value: dados.leadsStatus.fechado, color: 'green' }
                        ].map((etapa, i) => {
                            const total = dados.leadsStatus.novo || 1;
                            const perc = (etapa.value / total) * 100;
                            return (
                                <React.Fragment key={i}>
                                    <div className="flex-1">
                                        <div className={'bg-' + etapa.color + '-500 text-white p-2 rounded text-center'}>
                                            <div className="text-base font-bold">{etapa.value}</div>
                                            <div className="text-[8px] opacity-90">{etapa.label}</div>
                                            <div className="text-[7px] opacity-75">{perc.toFixed(0)}%</div>
                                        </div>
                                    </div>
                                    {i < 3 && <div className="text-gray-300 text-xs self-center">→</div>}
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }
    
    // PERFORMANCE POR VENDEDOR - Layout de tabela ranking
    else if (relatorioAtivo === 'performanceVendedores') {
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="grid grid-cols-4 gap-3">
                    <div className="bg-white p-3 rounded-lg shadow-sm border text-center">
                        <div className="text-2xl font-bold text-blue-600">{dados.performanceVendedores.length}</div>
                        <div className="text-[10px] text-gray-600">Vendedores Ativos</div>
                    </div>
                    <div className="bg-white p-3 rounded-lg shadow-sm border text-center">
                        <div className="text-2xl font-bold text-green-600">{fmt(dados.faturamentoTotal)}</div>
                        <div className="text-[10px] text-gray-600">Faturamento Total</div>
                    </div>
                    <div className="bg-white p-3 rounded-lg shadow-sm border text-center">
                        <div className="text-2xl font-bold text-purple-600">{fmt(dados.ticketMedio)}</div>
                        <div className="text-[10px] text-gray-600">Ticket Médio Geral</div>
                    </div>
                    <div className="bg-white p-3 rounded-lg shadow-sm border text-center">
                        <div className="text-2xl font-bold text-orange-600">{dados.totalVendas}</div>
                        <div className="text-[10px] text-gray-600">Total de Vendas</div>
                    </div>
                </div>

                <div className="bg-white rounded-lg shadow-sm border overflow-hidden">
                    <div className="bg-gray-50 p-3 border-b">
                        <h3 className="text-sm font-bold text-gray-800">📊 Ranking Completo de Vendedores</h3>
                    </div>
                    <table className="w-full">
                        <thead className="bg-gray-100 border-b">
                            <tr>
                                <th className="px-4 py-2 text-left text-[10px] font-bold text-gray-700">#</th>
                                <th className="px-4 py-2 text-left text-[10px] font-bold text-gray-700">Vendedor</th>
                                <th className="px-4 py-2 text-center text-[10px] font-bold text-gray-700">Vendas</th>
                                <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-700">Faturamento</th>
                                <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-700">Ticket Médio</th>
                                <th className="px-4 py-2 text-center text-[10px] font-bold text-gray-700">Performance</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {dados.performanceVendedores.map((v, i) => {
                                const percFaturamento = dados.faturamentoTotal > 0 ? (v.faturamento / dados.faturamentoTotal) * 100 : 0;
                                return (
                                    <tr key={i} className={'hover:bg-gray-50 ' + (i < 3 ? 'bg-green-50' : '')}>
                                        <td className="px-4 py-3 text-[10px] font-bold text-gray-600">{i + 1}</td>
                                        <td className="px-4 py-3">
                                            <div className="flex items-center gap-2">
                                                <div className={'w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs ' + (i === 0 ? 'bg-yellow-500' : i === 1 ? 'bg-gray-400' : i === 2 ? 'bg-orange-600' : 'bg-blue-500')}>
                                                    {i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : v.nome.charAt(0)}
                                                </div>
                                                <div>
                                                    <div className="text-[10px] font-bold">{v.nome}</div>
                                                    <div className="text-[8px] text-gray-500">{percFaturamento.toFixed(1)}% do total</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td className="px-4 py-3 text-center">
                                            <span className="text-[11px] font-bold text-blue-600">{v.vendas}</span>
                                        </td>
                                        <td className="px-4 py-3 text-right">
                                            <span className="text-[11px] font-bold text-green-600">{fmt(v.faturamento)}</span>
                                        </td>
                                        <td className="px-4 py-3 text-right">
                                            <span className="text-[11px] font-bold text-purple-600">{fmt(v.ticketMedio)}</span>
                                        </td>
                                        <td className="px-4 py-3">
                                            <div className="flex items-center justify-center gap-1">
                                                <div className="w-20 h-2 bg-gray-200 rounded-full overflow-hidden">
                                                    <div className={'h-full rounded-full ' + (percFaturamento > 30 ? 'bg-green-500' : percFaturamento > 15 ? 'bg-yellow-500' : 'bg-red-500')} style={{width: Math.min(percFaturamento * 3, 100) + '%'}}></div>
                                                </div>
                                                <span className="text-[9px] font-medium">{percFaturamento > 30 ? '🔥' : percFaturamento > 15 ? '⚡' : '📈'}</span>
                                            </div>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            </div>
        );
    }
    
    // TAXA DE CONVERSÃO - Layout focado no funil
    else if (relatorioAtivo === 'taxaConversao') {
        const taxaNovo = dados.leadsStatus.novo > 0 ? (dados.leadsStatus.interessado / dados.leadsStatus.novo) * 100 : 0;
        const taxaInteressado = dados.leadsStatus.interessado > 0 ? (dados.leadsStatus.negociacao / dados.leadsStatus.interessado) * 100 : 0;
        const taxaNegociacao = dados.leadsStatus.negociacao > 0 ? (dados.leadsStatus.fechado / dados.leadsStatus.negociacao) * 100 : 0;
        const taxaGeral = dados.leadsStatus.novo > 0 ? (dados.leadsStatus.fechado / dados.leadsStatus.novo) * 100 : 0;
        
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="bg-gradient-to-br from-purple-600 to-blue-600 p-6 rounded-lg shadow-lg text-white text-center">
                    <div className="text-[10px] opacity-75 mb-1">Taxa de Conversão Geral</div>
                    <div className="text-5xl font-bold mb-2">{taxaGeral.toFixed(1)}%</div>
                    <div className="text-xs">De {dados.leadsStatus.novo} leads iniciais, {dados.leadsStatus.fechado} foram fechados</div>
                </div>

                <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-4">🔄 Funil Detalhado de Conversão</h3>
                    <div className="space-y-3">
                        {[
                            { de: 'Novos', para: 'Interessados', valor: dados.leadsStatus.novo, convertidos: dados.leadsStatus.interessado, taxa: taxaNovo, color: 'blue' },
                            { de: 'Interessados', para: 'Negociação', valor: dados.leadsStatus.interessado, convertidos: dados.leadsStatus.negociacao, taxa: taxaInteressado, color: 'indigo' },
                            { de: 'Negociação', para: 'Fechados', valor: dados.leadsStatus.negociacao, convertidos: dados.leadsStatus.fechado, taxa: taxaNegociacao, color: 'purple' }
                        ].map((etapa, i) => (
                            <div key={i} className="border rounded-lg p-3 hover:shadow-md transition-all">
                                <div className="flex items-center justify-between mb-2">
                                    <div className="flex items-center gap-2">
