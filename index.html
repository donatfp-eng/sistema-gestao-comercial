        function ModalImport({ onImport, onClose }) { 
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [validacao, setValidacao] = useState(null);
            
            // Função para baixar modelo Excel
            const baixarModelo = () => {
                const dados = [
                    {
                        'Nome': 'João Silva',
                        'Telefone': '11987654321',
                        'Email': 'joao@email.com',
                        'Cargo': 'Gerente',
                        'Empresa': 'Empresa ABC',
                        'Status': 'novo',
                        'Observacoes': 'Cliente em potencial'
                    },
                    {
                        'Nome': 'Maria Santos',
                        'Telefone': '11976543210',
                        'Email': 'maria@email.com',
                        'Cargo': 'Diretora',
                        'Empresa': 'Empresa XYZ',
                        'Status': 'contato',
                        'Observacoes': ''
                    }
                ];
                
                const ws = XLSX.utils.json_to_sheet(dados);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Modelo');
                XLSX.writeFile(wb, 'Modelo_Clientes_Finais.xlsx');
            };
            
            // Função para validar dados
            const validarDados = (dados) => {
                const validacoes = [];
                const telefonesDuplicados = [];
                const telefonesExistentes = JSON.parse(localStorage.getItem('clientesFinais') || '[]').map(c => c.telefone?.replace(/\D/g, ''));
                
                dados.forEach((row, idx) => {
                    const erros = [];
                    const avisos = [];
                    
                    // Validar Nome
                    if (!row.Nome && !row.nome) {
                        erros.push('Nome obrigatório');
                    }
                    
                    // Validar Telefone
                    const tel = (row.Telefone || row.telefone || '').replace(/\D/g, '');
                    if (!tel) {
                        erros.push('Telefone obrigatório');
                    } else if (tel.length < 10 || tel.length > 11) {
                        erros.push('Telefone inválido (deve ter 10 ou 11 dígitos)');
                    }
                    
                    // Verificar duplicados na planilha
                    if (tel && telefonesDuplicados.includes(tel)) {
                        avisos.push('Telefone duplicado na planilha');
                    } else if (tel) {
                        telefonesDuplicados.push(tel);
                    }
                    
                    // Verificar se já existe no sistema
                    if (tel && telefonesExistentes.includes(tel)) {
                        avisos.push('Telefone já existe no sistema');
                    }
                    
                    // Validar Email
                    const email = row.Email || row.email || '';
                    if (email && !email.match(/^[^@]+@[^@]+\.[^@]+$/)) {
                        erros.push('Email inválido');
                    }
                    
                    validacoes.push({
                        linha: idx + 2, // +2 porque linha 1 é header
                        dados: row,
                        erros: erros,
                        avisos: avisos,
                        valido: erros.length === 0
                    });
                });
                
                return validacoes;
            };
            
            // Processar arquivo para preview
            const processarArquivo = (arquivo) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        console.log('📂 Processando arquivo:', arquivo.name);
                        let json = [];
                        
                        if (arquivo.name.endsWith('.csv')) {
                            const text = e.target.result;
                            const lines = text.split('\n');
                            const headers = lines[0].split(/[,;]/);
                            json = lines.slice(1).filter(line => line.trim()).map(line => {
                                const values = line.split(/[,;]/);
                                const obj = {};
                                headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim() || '');
                                return obj;
                            });
                        } else {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, {type: 'array'});
                            const sheet = workbook.Sheets[workbook.SheetNames[0]];
                            json = XLSX.utils.sheet_to_json(sheet);
                        }
                        
                        console.log('📊 Dados extraídos:', json);
                        const validacoes = validarDados(json);
                        console.log('✅ Validações:', validacoes);
                        setPreview(json);
                        setValidacao(validacoes);
                    } catch (err) {
                        console.error('Erro ao processar arquivo:', err);
                        // Mostrar erro no estado em vez de alert
                        setValidacao([{
                            linha: 0,
                            dados: {},
                            erros: ['Erro ao processar arquivo: ' + err.message],
                            avisos: [],
                            valido: false
                        }]);
                        setPreview([]);
                    }
                };
                
                if (arquivo.name.endsWith('.csv')) {
                    reader.readAsText(arquivo);
                } else {
                    reader.readAsArrayBuffer(arquivo);
                }
            };
            
            // Quando seleciona arquivo
            const handleFileChange = (e) => {
                const arquivo = e.target.files[0];
                setFile(arquivo);
                if (arquivo) {
                    processarArquivo(arquivo);
                }
            }; 
            // Se não tem preview, mostrar tela de upload
            if (!preview) {
                return (
                    <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} onClick={onClose}>
                        <div style={{background: 'white', borderRadius: '16px', padding: '32px', maxWidth: '400px', width: '100%', margin: '16px'}} onClick={(e) => e.stopPropagation()}>
                            <h2 className="text-xl font-bold mb-4">Importar Clientes</h2>
                            <button onClick={baixarModelo} className="w-full bg-blue-100 border-2 border-blue-300 text-blue-700 py-2 rounded-lg font-medium text-sm mb-4 hover:bg-blue-200">
                                📥 Baixar Modelo Excel
                            </button>
                            <div className="border-4 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-green-500 cursor-pointer" onClick={() => document.getElementById('fileInput').click()}>
                                <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFileChange} className="hidden" id="fileInput" />
                                <div className="text-5xl mb-4">📊</div>
                                <div style={{fontSize: '12px'}} className="text-gray-600 mb-2">Clique para selecionar arquivo</div>
                                <div style={{fontSize: '11px'}} className="text-gray-500 mt-1">Excel (.xlsx, .xls) ou CSV</div>
                                {file && <div style={{fontSize: '11px'}} className="font-semibold text-green-600 mt-3">{file.name}</div>}
                            </div>
                            <button onClick={onClose} className="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold text-sm mt-4">Cancelar</button>
                        </div>
                    </div>
                );
            }
            
            // Mostrar preview com validação
            if (!validacao || validacao.length === 0) {
                return (
                    <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000}} onClick={onClose}>
                        <div style={{background: 'white', borderRadius: '16px', padding: '32px', maxWidth: '400px', width: '100%', margin: '16px'}} onClick={(e) => e.stopPropagation()}>
                            <h2 className="text-xl font-bold mb-4 text-red-600">❌ Erro ao processar arquivo</h2>
                            <p className="text-sm text-gray-600 mb-4">Verifique se o arquivo está no formato correto (Excel ou CSV).</p>
                            <button onClick={() => { setPreview(null); setValidacao(null); setFile(null); }} className="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold text-sm">← Tentar Novamente</button>
                        </div>
                    </div>
                );
            }
            
            const validos = validacao.filter(v => v.valido).length;
            const erros = validacao.filter(v => !v.valido).length;
            const avisos = validacao.filter(v => v.avisos.length > 0).length;
            
            return (
                <div style={{position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px'}} onClick={onClose}>
                    <div style={{background: 'white', borderRadius: '16px', padding: '24px', maxWidth: '900px', width: '100%', maxHeight: '90vh', overflow: 'auto'}} onClick={(e) => e.stopPropagation()}>
                        <h2 className="text-xl font-bold mb-4">✅ Preview da Importação</h2>
                        
                        <div className="grid grid-cols-3 gap-3 mb-4">
                            <div className="bg-green-100 border-2 border-green-300 rounded-lg p-3 text-center">
                                <div className="text-2xl font-bold text-green-700">{validos}</div>
                                <div className="text-xs text-green-600">Válidos</div>
                            </div>
                            <div className="bg-red-100 border-2 border-red-300 rounded-lg p-3 text-center">
                                <div className="text-2xl font-bold text-red-700">{erros}</div>
                                <div className="text-xs text-red-600">Com Erros</div>
                            </div>
                            <div className="bg-yellow-100 border-2 border-yellow-300 rounded-lg p-3 text-center">
                                <div className="text-2xl font-bold text-yellow-700">{avisos}</div>
                                <div className="text-xs text-yellow-600">Avisos</div>
                            </div>
                        </div>
                        
                        <div className="border rounded-lg overflow-auto" style={{maxHeight: '400px'}}>
                            <table className="w-full text-xs">
                                <thead className="bg-gray-100 sticky top-0">
                                    <tr>
                                        <th className="px-2 py-2 text-left">Linha</th>
                                        <th className="px-2 py-2 text-left">Nome</th>
                                        <th className="px-2 py-2 text-left">Telefone</th>
                                        <th className="px-2 py-2 text-left">Email</th>
                                        <th className="px-2 py-2 text-left">Status</th>
                                        <th className="px-2 py-2 text-left">Validação</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {validacao.map((v, idx) => (
                                        <tr key={idx} className={v.valido ? 'bg-green-50' : 'bg-red-50'}>
                                            <td className="px-2 py-2 font-mono">{v.linha}</td>
                                            <td className="px-2 py-2">{v.dados.Nome || v.dados.nome || '-'}</td>
                                            <td className="px-2 py-2 font-mono">{v.dados.Telefone || v.dados.telefone || '-'}</td>
                                            <td className="px-2 py-2">{v.dados.Email || v.dados.email || '-'}</td>
                                            <td className="px-2 py-2">
                                                {v.valido ? <span className="text-green-600 font-bold">✓</span> : <span className="text-red-600 font-bold">✗</span>}
                                            </td>
                                            <td className="px-2 py-2">
                                                {v.erros.map((e, i) => <div key={i} className="text-red-600 text-xs">❌ {e}</div>)}
                                                {v.avisos.map((a, i) => <div key={i} className="text-yellow-600 text-xs">⚠️ {a}</div>)}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="flex gap-3 mt-4">
                            <button onClick={() => { setPreview(null); setValidacao(null); setFile(null); }} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded-lg font-semibold text-sm">← Voltar</button>
                            <button onClick={() => { if(validos > 0) onImport(file); }} disabled={validos === 0} className="flex-1 bg-green-500 hover:bg-green-600 disabled:bg-gray-300 text-white py-3 rounded-lg font-semibold text-sm">
                                Importar {validos} {validos === 1 ? 'Registro' : 'Registros'}
                            </button>
                        </div>
                    </div>
                </div>
            ); 
        }

        function LancamentoLote({ vendedores, clientes, clientesFinais, ligacoes, vendas, showToast, onReload }) {
            const [abaAtiva, setAbaAtiva] = React.useState('metricas');
            const [vendedorSelecionado, setVendedorSelecionado] = React.useState('');
            const [dataInicio, setDataInicio] = React.useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0]);
            const [dataFim, setDataFim] = React.useState(new Date().toISOString().split('T')[0]);
            
            // Form de lançamento
            const [formLigacao, setFormLigacao] = React.useState({
                vendedor_id: '',
                cliente_id: '',
                data: new Date().toISOString().split('T')[0],
                tentadas: 1,
                efetivadas: 0,
                observacoes: ''
            });
            
            const [formVenda, setFormVenda] = React.useState({
                tipo: 'venda',
                forma_pagamento: 'pix',
                parcelas: 1,
                produto: '',
                cliente_final_id: '',
                recorrente: false,
                dia_cobranca: 10,
                duracao_meses: 12,
                vendedor_id: '',
                cliente_id: '',
                data: new Date().toISOString().split('T')[0],
                valor_bruto: '',
                observacoes: ''
            });
            const [buscaLead, setBuscaLead] = React.useState("");
            
            // Novo vendedor
            const [novoVendedor, setNovoVendedor] = React.useState({ nome: '', email: '', telefone: '' });
            
            const fmt = (v) => new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(v);
            
            // ============================================
            // 📊 CÁLCULO DE MÉTRICAS
            // ============================================
            const calcularMetricas = (vendedorId = null) => {
                const inicio = new Date(dataInicio + 'T00:00:00');
                const fim = new Date(dataFim + 'T23:59:59');
                
                let ligacoesFiltradas = ligacoes.filter(l => {
                    const dataLig = new Date(l.data);
                    return dataLig >= inicio && dataLig <= fim;
                });
                
                let vendasFiltradas = vendas.filter(v => {
                    const dataVenda = v.data ? v.data.substring(0,10) : null;
                    return dataVenda && dataVenda >= dataInicio && dataVenda <= dataFim;
                });
                
                if (vendedorId) {
                    ligacoesFiltradas = ligacoesFiltradas.filter(l => l.vendedor_id === parseInt(vendedorId));
                    vendasFiltradas = vendasFiltradas.filter(v => v.vendedor_id === parseInt(vendedorId));
                }
                
                const tentadas = ligacoesFiltradas.length;
                const efetivadas = ligacoesFiltradas.filter(l => l.status === 'efetivada').length;
                const ausentes = ligacoesFiltradas.filter(l => l.status === 'ausente').length;
                const totalVendas = vendasFiltradas.length;
                const faturamento = vendasFiltradas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0);
                const ticketMedio = totalVendas > 0 ? faturamento / totalVendas : 0;
                
                const pctEfetivacao = tentadas > 0 ? ((efetivadas / tentadas) * 100) : 0;
                const pctConversao = efetivadas > 0 ? ((totalVendas / efetivadas) * 100) : 0;
                const pctGeralConversao = tentadas > 0 ? ((totalVendas / tentadas) * 100) : 0;
                
                return {
                    tentadas,
                    efetivadas,
                    ausentes,
                    totalVendas,
                    faturamento,
                    ticketMedio,
                    pctEfetivacao,
                    pctConversao,
                    pctGeralConversao
                };
            };
            
            const metricasGerais = calcularMetricas(vendedorSelecionado || null);
            
            // Métricas por vendedor
            const metricasPorVendedor = vendedores.map(v => ({
                ...v,
                metricas: calcularMetricas(v.id)
            })).sort((a, b) => b.metricas.faturamento - a.metricas.faturamento);
            
            // ============================================
            // 💾 FUNÇÕES DE SALVAMENTO
            // ============================================
            const salvarLigacoes = async () => {
                if (!formLigacao.vendedor_id || !formLigacao.cliente_id) {
                    showToast('Selecione vendedor e cliente!', 'error');
                    return;
                }
                
                const vendedor = vendedores.find(v => v.id === parseInt(formLigacao.vendedor_id));
                const cliente = clientes.find(c => c.id === parseInt(formLigacao.cliente_id));
                const token = localStorage.getItem('token');
                
                try {
                    // Criar ligações efetivadas
                    for (let i = 0; i < formLigacao.efetivadas; i++) {
                        await fetch('/api/ligacoes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify({
                                vendedor_id: parseInt(formLigacao.vendedor_id),
                                cliente_id: parseInt(formLigacao.cliente_id),
                                data: formLigacao.data + 'T10:00:00',
                                status: 'efetivada',
                                cliente_nome: cliente?.nome || '',
                                vendedor_nome: vendedor?.nome || '',
                                observacoes: formLigacao.observacoes
                            })
                        });

                const token = localStorage.getItem('token');
                
                try {
                    await fetch('/api/vendas', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({

                            cliente_id: parseInt(formVenda.cliente_id),
                            data: formVenda.data + 'T10:00:00',

        const dataInicioComp = new Date(dataInicio);
        dataInicioComp.setDate(dataInicioComp.getDate() - diasPeriodo);
        const vendasComp = vendasBase.filter(v => new Date(v.data) >= dataInicioComp && new Date(v.data) < dataInicio);

        const crescimento = faturamentoComp > 0 ? ((faturamentoTotal - faturamentoComp) / faturamentoComp) * 100 : 0;
        
        const tresDias = new Date(hoje.getTime() - 3 * 24 * 60 * 60 * 1000);
        const leadsSemFollowup = clientesFiltrados.filter(c => {
            const ultima = c.ultima_interacao ? new Date(c.ultima_interacao) : null;

        if (leadsSemFollowup < totalLeads * 0.2) healthScore += 25; else if (leadsSemFollowup < totalLeads * 0.4) healthScore += 15;
        if (totalVendas > 0) healthScore += 20;
        const healthColor = healthScore >= 75 ? 'green' : healthScore >= 50 ? 'yellow' : 'red';

            return { id: v.id, nome: v.nome, vendas: vendasV.length, faturamento, ticketMedio: vendasV.length > 0 ? faturamento / vendasV.length : 0 };

                        <div className="text-[10px] opacity-75 mb-1">Faturamento Total</div>
                        <div className="text-3xl font-bold">{fmt(dados.faturamentoTotal)}</div>
                        <div className={'text-xs mt-1 ' + (dados.crescimento >= 0 ? 'text-green-200' : 'text-red-200')}>
                            {dados.crescimento >= 0 ? '↗️' : '↘️'} {Math.abs(dados.crescimento).toFixed(1)}% vs período anterior
                        </div>
                    </div>
                    <div className="bg-gradient-to-br from-blue-500 to-blue-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Total de Vendas</div>
                        <div className="text-3xl font-bold">{dados.totalVendas}</div>
                        <div className="text-xs mt-1">{(dados.totalVendas / dados.diasPeriodo).toFixed(1)} vendas/dia</div>
                    </div>
                    <div className="bg-gradient-to-br from-purple-500 to-purple-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Ticket Médio</div>
                        <div className="text-3xl font-bold">{fmt(dados.ticketMedio)}</div>
                        <div className="text-xs mt-1">Por venda realizada</div>
                    </div>
                </div>

                <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-3">📅 Análise do Período</h3>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <div className="text-[10px] text-gray-600 mb-2">Distribuição por Status</div>
                            <div className="space-y-2">
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Faturadas</span>
                                    <span className="text-[10px] font-bold text-green-600">
                                        {dados.vendasFiltradas.filter(v => v.faturada).length}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Pendentes</span>
                                    <span className="text-[10px] font-bold text-yellow-600">
                                        {dados.vendasFiltradas.filter(v => !v.faturada).length}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div className="text-[10px] text-gray-600 mb-2">Métricas do Período</div>
                            <div className="space-y-2">
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Dias analisados</span>
                                    <span className="text-[10px] font-bold">{dados.diasPeriodo}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Média diária</span>
                                    <span className="text-[10px] font-bold">{fmt(dados.faturamentoTotal / dados.diasPeriodo)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    }
    
    // PERFORMANCE CLIENTE B2B - Layout detalhado
    else if (relatorioAtivo === 'clientesB2B') {
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="bg-white p-3 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-3">🏢 Análise Detalhada por Cliente B2B</h3>
                    <div className="space-y-2">
                        {clientes.map(c => {
                            const leads = dados.clientesFiltrados.filter(cf => cf.cliente_primario_id === c.id);
                            const vendasC = dados.vendasFiltradas.filter(v => v.cliente_id === c.id);
                            const conversao = leads.length > 0 ? (vendasC.length / leads.length) * 100 : 0;
                            const faturamento = vendasC.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0);
                            const ticketMedioCliente = vendasC.length > 0 ? faturamento / vendasC.length : 0;
                            
                            return (
                                <div key={c.id} className="p-3 border-2 rounded-lg hover:border-green-300 transition-all">
                                    <div className="flex items-center justify-between mb-2">
                                        <h4 className="text-[11px] font-bold">{c.nome}</h4>
                                        <div className="text-right">
                                            <div className="text-base font-bold text-green-600">{fmt(faturamento)}</div>
                                            <div className="text-[8px] text-gray-500">Faturamento total</div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-5 gap-2">
                                        <div className="text-center p-2 bg-blue-50 rounded">
                                            <div className="text-base font-bold text-blue-600">{leads.length}</div>
                                            <div className="text-[8px] text-gray-600">Leads</div>
                                        </div>
                                        <div className="text-center p-2 bg-green-50 rounded">
                                            <div className="text-base font-bold text-green-600">{vendasC.length}</div>
                                            <div className="text-[8px] text-gray-600">Vendas</div>
                                        </div>
                                        <div className="text-center p-2 bg-purple-50 rounded">
                                            <div className="text-base font-bold text-purple-600">{conversao.toFixed(0)}%</div>
                                            <div className="text-[8px] text-gray-600">Conversão</div>
                                        </div>
                                        <div className="text-center p-2 bg-orange-50 rounded">
                                            <div className="text-base font-bold text-orange-600">{fmt(ticketMedioCliente)}</div>
                                            <div className="text-[8px] text-gray-600">Ticket</div>
                                        </div>
                                        <div className={'text-center p-2 rounded ' + (conversao >= 20 ? 'bg-green-100' : conversao >= 10 ? 'bg-yellow-100' : 'bg-red-100')}>
                                            <div className="text-lg">{conversao >= 20 ? '🔥' : conversao >= 10 ? '⚡' : '❄️'}</div>
                                            <div className="text-[8px] text-gray-600">Status</div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }
    
    // MELHOR DIA DA SEMANA - Layout de análise temporal
    else if (relatorioAtivo === 'melhorDiaSemana') {
        const faturamentoPorDia = [0,0,0,0,0,0,0];
        dados.vendasFiltradas.forEach(v => {
            faturamentoPorDia[new Date(v.data).getDay()] += parseFloat(v.valor_bruto || 0);
        });
        const diaComMaiorFaturamento = faturamentoPorDia.indexOf(Math.max(...faturamentoPorDia));
        
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                    <div className="bg-gradient-to-br from-green-500 to-green-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Melhor Dia por Quantidade</div>
                        <div className="text-4xl font-bold mb-1">{dados.diasSemana[dados.melhorDia]}</div>
                        <div className="text-sm">{dados.vendasPorDia[dados.melhorDia]} vendas realizadas</div>
                    </div>
                    <div className="bg-gradient-to-br from-blue-500 to-blue-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Melhor Dia por Faturamento</div>
                        <div className="text-4xl font-bold mb-1">{dados.diasSemana[diaComMaiorFaturamento]}</div>
                        <div className="text-sm">{fmt(faturamentoPorDia[diaComMaiorFaturamento])} faturado</div>
                    </div>
                </div>

                <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-4">📊 Análise Completa por Dia da Semana</h3>
                    <div className="space-y-3">
                        {dados.diasSemana.map((dia, i) => {
                            const vendas = dados.vendasPorDia[i];
                            const faturamento = faturamentoPorDia[i];
                            const ticketDia = vendas > 0 ? faturamento / vendas : 0;
                            const maxVendas = Math.max(...dados.vendasPorDia);
                            const percVendas = maxVendas > 0 ? (vendas / maxVendas) * 100 : 0;
                            
                            return (
                                <div key={i} className={'p-3 rounded-lg border-2 ' + (i === dados.melhorDia ? 'border-green-400 bg-green-50' : 'border-gray-200')}>
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <div className={'w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs ' + (i === dados.melhorDia ? 'bg-green-500' : 'bg-gray-400')}>
                                                {dia.substring(0, 1)}
                                            </div>
                                            <div>
                                                <div className="text-[11px] font-bold">{dia}</div>
                                                <div className="text-[8px] text-gray-500">{vendas} vendas</div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[11px] font-bold text-green-600">{fmt(faturamento)}</div>
                                            <div className="text-[8px] text-gray-500">Ticket: {fmt(ticketDia)}</div>
                                        </div>
                                    </div>
                                    <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                                        <div className={'h-full rounded-full ' + (i === dados.melhorDia ? 'bg-green-500' : 'bg-blue-400')} style={{width: percVendas + '%'}}></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }
    
    // DEFAULT - Para relatórios ainda não implementados
    else {
        conteudoRelatorio = (
            <div className="bg-white p-8 rounded-lg shadow-sm border text-center">
                <div className="text-6xl mb-4">🚧</div>
                <h3 className="text-lg font-bold text-gray-800 mb-2">Relatório em Desenvolvimento</h3>
                <p className="text-sm text-gray-600">Este relatório específico ainda está sendo construído.</p>
                <button onClick={voltarListaRelatorios} className="mt-4 text-sm px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded font-medium">
                    ← Voltar para Lista de Relatórios
                </button>
            </div>
        );
    }
    
    // Renderizar relatório ativo
    return (
        <div className="space-y-3">
            <HeaderFiltros />
            {conteudoRelatorio}
            
            {/* Modal Detalhes do Vendedor */}
            {vendedorDetalhes && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
                        <div className="bg-gradient-to-r from-green-600 to-blue-600 p-4 text-white">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl font-bold">
                                        {vendedorDetalhes.nome?.charAt(0)}
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-bold">{vendedorDetalhes.nome}</h2>
                                        <p className="text-xs opacity-75">Detalhes completos do vendedor</p>
                                    </div>
                                </div>
                                <button onClick={() => setVendedorDetalhes(null)} className="text-white/80 hover:text-white text-2xl">×</button>
                            </div>
                        </div>
                        
                        <div className="p-4 overflow-y-auto max-h-[calc(90vh-100px)]">
                            {/* KPIs do Vendedor */}
                            <div className="grid grid-cols-4 gap-3 mb-4">
                                <div className="bg-blue-50 p-3 rounded-lg text-center">
                                    <div className="text-2xl font-bold text-blue-600">
                                        {clientesFinais.filter(l => l.vendedor_id === vendedorDetalhes.id).length}
                                    </div>
                                    <div className="text-[10px] text-blue-800">Total de Leads</div>
                                </div>
                                <div className="bg-green-50 p-3 rounded-lg text-center">
                                    <div className="text-2xl font-bold text-green-600">{fmt(vendedorDetalhes.faturamento || 0)}</div>
                                    <div className="text-[10px] text-green-800">Faturamento</div>
                                </div>
                                <div className="bg-purple-50 p-3 rounded-lg text-center">
                                    <div className="text-2xl font-bold text-purple-600">{vendedorDetalhes.vendas || 0}</div>
                                    <div className="text-[10px] text-purple-800">Vendas Fechadas</div>
                                </div>
                                <div className="bg-orange-50 p-3 rounded-lg text-center">
                                    <div className="text-2xl font-bold text-orange-600">
                                        {ligacoes.filter(l => l.vendedor_id === vendedorDetalhes.id).length}
                                    </div>
                                    <div className="text-[10px] text-orange-800">Ligações</div>
                                </div>
                            </div>
                            
                            {/* Pipeline do Vendedor */}
                            <div className="bg-gray-50 p-3 rounded-lg mb-4">
                                <h4 className="text-xs font-bold text-gray-700 mb-2">📊 Pipeline de Leads</h4>
                                <div className="grid grid-cols-5 gap-2">
                                    {['novo', 'contato', 'interessado', 'negociacao', 'fechado'].map(status => {
                                        const count = clientesFinais.filter(l => l.vendedor_id === vendedorDetalhes.id && l.status === status).length;
                                        const colors = { novo: 'blue', contato: 'cyan', interessado: 'yellow', negociacao: 'orange', fechado: 'green' };
                                        const labels = { novo: 'Novos', contato: 'Contato', interessado: 'Interessados', negociacao: 'Negociação', fechado: 'Fechados' };
                                        return (
                                            <div key={status} className={'bg-' + colors[status] + '-100 p-2 rounded text-center'}>
                                                <div className={'text-lg font-bold text-' + colors[status] + '-600'}>{count}</div>
                                                <div className="text-[9px] text-gray-600">{labels[status]}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                            
                            {/* Lista de Leads do Vendedor */}
                            <div className="bg-white border rounded-lg overflow-hidden">
                                <div className="bg-gray-100 px-3 py-2 border-b">
                                    <h4 className="text-xs font-bold text-gray-700">👥 Leads do Vendedor ({clientesFinais.filter(l => l.vendedor_id === vendedorDetalhes.id).length})</h4>
                                </div>
                                <div className="max-h-64 overflow-y-auto">
                                    <table className="w-full text-xs">
                                        <thead className="bg-gray-50 sticky top-0">
                                            <tr>
                                                <th className="px-3 py-2 text-left">Nome</th>
                                                <th className="px-3 py-2 text-left">Telefone</th>
                                                <th className="px-3 py-2 text-center">Status</th>
                                                <th className="px-3 py-2 text-right">Valor</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {clientesFinais.filter(l => l.vendedor_id === vendedorDetalhes.id).slice(0, 50).map(lead => (
                                                <tr key={lead.id} className="hover:bg-gray-50">
                                                    <td className="px-3 py-2 font-medium">{lead.nome}</td>
                                                    <td className="px-3 py-2 text-gray-600">{lead.telefone}</td>
                                                    <td className="px-3 py-2 text-center">
                                                        <span className={'px-2 py-0.5 rounded-full text-[9px] font-medium ' + 
                                                            (lead.status === 'fechado' ? 'bg-green-100 text-green-700' : 
                                                             lead.status === 'negociacao' ? 'bg-orange-100 text-orange-700' : 
                                                             lead.status === 'interessado' ? 'bg-yellow-100 text-yellow-700' : 
                                                             'bg-blue-100 text-blue-700')}>
                                                            {lead.status}
                                                        </span>
                                                    </td>
                                                    <td className="px-3 py-2 text-right font-bold text-green-600">{fmt(lead.valor_potencial || 0)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {clientesFinais.filter(l => l.vendedor_id === vendedorDetalhes.id).length > 50 && (
                                        <div className="text-center py-2 text-xs text-gray-500">
                                            ... e mais {clientesFinais.filter(l => l.vendedor_id === vendedorDetalhes.id).length - 50} leads
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}
function Comissoes({ vendas, vendedores, fmt, showToast, usuarioLogado }) {
    const [filtroPago, setFiltroPago] = useState('pendente');
    
    // Filtrar vendedores baseado no perfil
    const vendedoresFiltrados = usuarioLogado?.perfil === 'vendedor'
        ? vendedores.filter(v => v.usuario_id === usuarioLogado.id)
        : usuarioLogado?.perfil === 'gerente'
        ? vendedores.filter(v => v.gerente_id === usuarioLogado.id)
        : vendedores;
    
    const vendasFiltradas = vendas.filter(v => 
        filtroPago === 'todos' ? true : 
        filtroPago === 'pago' ? v.comissao_paga : 
        !v.comissao_paga
    );
    
    return (
        <div className="space-y-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border">
                <select value={filtroPago} onChange={(e) => setFiltroPago(e.target.value)} className="px-4 py-2 border rounded-lg">
                    <option value="pendente">💰 Pendentes</option>
                    <option value="pago">✅ Pagas</option>
                    <option value="todos">📋 Todas</option>
                </select>
            </div>
            
            <div className="grid grid-cols-3 gap-4">
                {vendedoresFiltrados.map(v => {
                    const vendasV = vendasFiltradas.filter(vd => vd.vendedor_id === v.id);
                    const totalComissao = vendasV.reduce((s, vd) => s + parseFloat(vd.valor_comissao || 0), 0);
                    return (
                        <div key={v.id} className="bg-white p-5 rounded-xl shadow-sm border">
                            <h3 className="font-bold text-lg mb-3">{v.nome}</h3>
                            <div className="text-3xl font-bold text-green-600 mb-2">{fmt(totalComissao)}</div>
                            <div className="text-sm text-gray-600">{vendasV.length} vendas</div>
                        </div>
                    );
                })}
            </div>
            
            <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table className="w-full">
                    <thead className="bg-gray-50 border-b">
                        <tr>
                            <th className="px-6 py-3 text-left text-xs font-semibold">Vendedor</th>
                            <th className="px-6 py-3 text-left text-xs font-semibold">Cliente</th>
                            <th className="px-6 py-3 text-right text-xs font-semibold">Venda</th>
                            <th className="px-6 py-3 text-right text-xs font-semibold">Comissão</th>
                            <th className="px-6 py-3 text-center text-xs font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y">
                        {vendasFiltradas.map(v => (
                            <tr key={v.id} className="hover:bg-gray-50">
                                <td className="px-6 py-4 text-sm">{v.vendedor_nome}</td>
                                <td className="px-6 py-4 text-sm">{v.cliente_nome}</td>
                                <td className="px-6 py-4 text-sm text-right font-bold">{fmt(v.valor_bruto)}</td>
                                <td className="px-6 py-4 text-sm text-right font-bold text-green-600">{fmt(v.valor_comissao)}</td>
                                <td className="px-6 py-4 text-center">
                                    <span className={'px-3 py-1 rounded-full text-xs font-semibold ' + (v.comissao_paga ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}>
                                        {v.comissao_paga ? '✅ Paga' : '⏳ Pendente'}
                                    </span>
                                </td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
