<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSD - Sistema de Gestão Comercial</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fafafa; }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: #f0f0f0; }
        .sidebar-item.active { background: #e8f5e9; border-left: 3px solid #4caf50; font-weight: 600; }
        .sortable-header { cursor: pointer; user-select: none; }
        .sortable-header:hover { background: #f5f5f5; }
        .kanban-column { min-height: 600px; background: #f8f9fa; border-radius: 12px; padding: 16px; }
        .contact-card { cursor: move; transition: all 0.2s; }
        .contact-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .contact-card.dragging { opacity: 0.5; }
        .tag { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-right: 4px; }
        .tag-urgente { background: #fee; color: #c00; }
        .tag-vip { background: #fef3c7; color: #92400e; }
        .tag-cold { background: #dbeafe; color: #1e40af; }
        .tag-quente { background: #fecaca; color: #991b1b; }
        .priority-high { border-left: 4px solid #ef4444 !important; }
        .priority-medium { border-left: 4px solid #f59e0b !important; }
        .priority-low { border-left: 4px solid #10b981 !important; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .notification-badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 9999px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_URL = '/api';
        
        const api = {
            from: (table) => ({
                select: async () => {
                    const token = sessionStorage.getItem('token');
                    const res = await fetch(API_URL + '/' + table, { headers: token ? {'Authorization': 'Bearer ' + token} : {} });
                    return {data: res.ok ? await res.json() : []};
                },
                insert: async (records) => {
                    const token = sessionStorage.getItem('token');
                    const arr = Array.isArray(records) ? records : [records];
                    for (const r of arr) {
                        await fetch(API_URL + '/' + table, { method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify(r) });
                    }
                },
                update: async (id, record) => {
                    const token = sessionStorage.getItem('token');
                    await fetch(API_URL + '/' + table + '/' + id, { method: 'PUT', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token}, body: JSON.stringify(record) });
                },
                delete: async (id) => {
                    const token = sessionStorage.getItem('token');
                    await fetch(API_URL + '/' + table + '/' + id, { method: 'DELETE', headers: {'Authorization': 'Bearer ' + token} });
                }
            })
        };

        const exportToExcel = (data, filename) => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Dados");
            XLSX.writeFile(wb, filename + ".xlsx");
        };

        const exportToPDF = (headers, rows, title, filename) => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text(title, 14, 15);
            doc.setFontSize(10);
            doc.text('GSD - Sistema de Gestão Comercial', 14, 22);
            doc.text('Data: ' + new Date().toLocaleDateString('pt-BR'), 14, 28);
            doc.autoTable({
                startY: 35,
                head: [headers],
                body: rows,
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [76, 175, 80], fontStyle: 'bold' }
            });
            doc.save(filename + ".pdf");
        };

        function App() {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('workspace');
            const [loading, setLoading] = useState(true);
            const [showModal, setShowModal] = useState(null);
            const [toast, setToast] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [data, setData] = useState({ usuarios: [], clientes: [], clientesFinais: [], vendedores: [], vendas: [], ligacoes: [] });

            useEffect(() => {
                const saved = localStorage.getItem('user');
                if (saved) setUser(JSON.parse(saved));
                loadData();
                
                // Verificar notificações a cada 30 segundos
                const interval = setInterval(checkNotifications, 30000);
                return () => clearInterval(interval);
            }, []);

            const loadData = async () => {
                const [u, c, cf, vd, v, l] = await Promise.all([
                    api.from('usuarios').select(), api.from('clientes').select(), api.from('clientes_finais').select(),
                    api.from('vendedores').select(), api.from('vendas').select(), api.from('ligacoes').select()
                ]);
                setData({ usuarios: u.data, clientes: c.data, clientesFinais: cf.data, vendedores: vd.data, vendas: v.data, ligacoes: l.data });
                setLoading(false);
                checkNotifications(cf.data);
            };

            const checkNotifications = (contatos = data.clientesFinais) => {
                const now = new Date();
                const newNotifications = [];
                
                contatos.forEach(c => {
                    // Verificar follow-ups pendentes
                    if (c.proximo_followup) {
                        const followupDate = new Date(c.proximo_followup);
                        const diff = followupDate - now;
                        const hoursUntil = diff / (1000 * 60 * 60);
                        
                        if (hoursUntil > 0 && hoursUntil < 2) {
                            newNotifications.push({
                                id: 'followup-' + c.id,
                                type: 'followup',
                                message: `Follow-up com ${c.nome} em ${Math.round(hoursUntil * 60)} minutos`,
                                contact: c,
                                urgent: hoursUntil < 0.5
                            });
                        }
                    }
                    
                    // Verificar leads quentes sem interação há muito tempo
                    if (c.status === 'interessado' || c.status === 'negociacao') {
                        if (c.ultima_interacao) {
                            const lastInteraction = new Date(c.ultima_interacao);
                            const daysSince = (now - lastInteraction) / (1000 * 60 * 60 * 24);
                            
                            if (daysSince > 3) {
                                newNotifications.push({
                                    id: 'cold-' + c.id,
                                    type: 'warning',
                                    message: `${c.nome} está há ${Math.round(daysSince)} dias sem contato!`,
                                    contact: c,
                                    urgent: daysSince > 7
                                });
                            }
                        }
                    }
                });
                
                setNotifications(newNotifications);
            };

            const showToast = (msg, type = 'success') => { 
                setToast({msg, type}); 
                setTimeout(() => setToast(null), 3000); 
            };

            const login = async (email, senha) => {
                const res = await fetch(API_URL + '/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password: senha}) });
                if (res.ok) {
                    const {token, user} = await res.json();
                    sessionStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    setUser(user);
                    return true;
                }
                return false;
            };

            const addCliente = async (form) => { await api.from('clientes').insert([form]); await loadData(); setShowModal(null); showToast('Cliente adicionado!'); };
            const editCliente = async (id, form) => { await api.from('clientes').update(id, form); await loadData(); setShowModal(null); showToast('Cliente atualizado!'); };
            const deleteCliente = async (id) => { await api.from('clientes').delete(id); await loadData(); showToast('Cliente excluído!'); };
            
            const addContato = async (form) => { 
                await api.from('clientes_finais').insert([{...form, status: 'novo', ultima_interacao: new Date().toISOString()}]); 
                await loadData(); 
                setShowModal(null); 
                showToast('Lead adicionado!'); 
            };
            
            const editContato = async (id, form) => { 
                await api.from('clientes_finais').update(id, {...form, ultima_interacao: new Date().toISOString()}); 
                await loadData(); 
                setShowModal(null); 
                showToast('Lead atualizado!'); 
            };
            
            const deleteContato = async (id) => { await api.from('clientes_finais').delete(id); await loadData(); showToast('Lead excluído!'); };
            
            const addVenda = async (form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                const comissao = parseFloat(form.valor_bruto) * (parseFloat(cliente.percentual_comissao) / 100);
                await api.from('vendas').insert([{ cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), valor_bruto: parseFloat(form.valor_bruto), valor_comissao: comissao, data: new Date().toISOString(), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, faturada: false }]);
                await loadData(); setShowModal(null); showToast('Venda registrada!', 'success');
            };
            
            const editVenda = async (id, form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                const comissao = parseFloat(form.valor_bruto) * (parseFloat(cliente.percentual_comissao) / 100);
                await api.from('vendas').update(id, { cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), valor_bruto: parseFloat(form.valor_bruto), valor_comissao: comissao, cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, faturada: form.faturada });
                await loadData(); setShowModal(null); showToast('Venda atualizada!');
            };
            
            const deleteVenda = async (id) => { await api.from('vendas').delete(id); await loadData(); showToast('Venda excluída!'); };

            const addLigacao = async (form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                await api.from('ligacoes').insert([{ cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), data: new Date().toISOString(), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, status: form.status }]);
                
                // Atualizar última interação do contato
                const contato = data.clientesFinais.find(c => c.cliente_primario_id === parseInt(form.cliente_id));
                if (contato) {
                    await api.from('clientes_finais').update(contato.id, { ultima_interacao: new Date().toISOString() });
                }
                
                await loadData(); 
                setShowModal(null); 
                showToast('Atividade registrada!');
            };
            
            const editLigacao = async (id, form) => {
                const cliente = data.clientes.find(c => c.id === parseInt(form.cliente_id));
                const vendedor = data.vendedores.find(v => v.id === parseInt(form.vendedor_id));
                await api.from('ligacoes').update(id, { cliente_id: parseInt(form.cliente_id), vendedor_id: parseInt(form.vendedor_id), cliente_nome: cliente.nome, vendedor_nome: vendedor.nome, status: form.status });
                await loadData(); setShowModal(null); showToast('Atividade atualizada!');
            };
            
            const deleteLigacao = async (id) => { await api.from('ligacoes').delete(id); await loadData(); showToast('Atividade excluída!'); };

            const importExcel = async (file) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    for (const row of json) {
                        await api.from('clientes_finais').insert([{ 
                            nome: row.Nome || row.nome, 
                            telefone: row.Telefone || row.telefone, 
                            whatsapp: row.WhatsApp || row.whatsapp, 
                            email: row.Email || row.email, 
                            cliente_primario_id: parseInt(row.ClienteID || row.cliente_id || 1), 
                            status: 'novo',
                            ultima_interacao: new Date().toISOString()
                        }]);
                    }
                    await loadData(); setShowModal(null); showToast('Importado ' + json.length + ' leads!');
                };
                reader.readAsArrayBuffer(file);
            };

            const fmt = (v) => new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'}).format(v);

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div></div>;
            if (!user) return <Login onLogin={login} />;

            const kpis = { 
                faturamento: data.vendas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0), 
                comissoes: data.vendas.reduce((s, v) => s + parseFloat(v.valor_comissao || 0), 0), 
                totalLig: data.ligacoes.length, 
                ligEfet: data.ligacoes.filter(l => l.status === 'efetivada').length, 
                totalVendas: data.vendas.length,
                ticketMedio: data.vendas.length > 0 ? data.vendas.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0) / data.vendas.length : 0,
                taxaConversao: data.ligacoes.length > 0 ? (data.vendas.length / data.ligacoes.filter(l => l.status === 'efetivada').length) * 100 : 0,
                vendasPendentes: data.vendas.filter(v => !v.faturada).length,
                vendasFaturadas: data.vendas.filter(v => v.faturada).length,
                totalClientes: data.clientes.length,
                totalContatos: data.clientesFinais.length
            };

            const menuItems = [
                {id: 'workspace', icon: '⚡', label: 'Área de Trabalho', badge: notifications.length},
                {id: 'pipeline', icon: '🔄', label: 'Pipeline'},
                {id: 'dashboard', icon: '📊', label: 'Dashboard'}, 
                {id: 'vendas', icon: '💰', label: 'Vendas'}, 
                {id: 'clientes', icon: '🏢', label: 'Clientes'}, 
                {id: 'clientes_finais', icon: '👥', label: 'Contatos'}, 
                {id: 'ligacoes', icon: '📞', label: 'Atividades'},
                {id: 'chat', icon: '💬', label: 'Chat'},
                {id: 'usuarios', icon: '👥', label: 'Usuários'},
                {id: 'metas', icon: '🎯', label: 'Metas'},
                {id: 'relatorios', icon: '📊', label: 'Relatórios'},
                {id: 'comissoes', icon: '💰', label: 'Comissões'}
            ];

            return (
                <div className="flex h-screen" style={{background: '#fafafa'}}>
                    <div className="w-64 bg-white border-r flex flex-col">
                        <div className="p-6 border-b">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">G</div>
                                <div><div className="font-bold text-lg">GSD</div><div style={{fontSize: '11px'}} className="text-gray-500">Gestão Comercial</div></div>
                            </div>
                        </div>
                        <div className="flex-1 py-4">
                            {menuItems.map(item => (
                                <button key={item.id} onClick={() => setPage(item.id)} className={'sidebar-item w-full flex items-center gap-3 px-6 py-3 text-left relative ' + (page === item.id ? 'active text-green-700' : 'text-gray-700')}>
                                    <span className="text-xl">{item.icon}</span>
                                    <span style={{fontSize: '13px'}} className="font-medium flex-1">{item.label}</span>
                                    {item.badge > 0 && <span className="bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">{item.badge}</span>}
                                </button>
                            ))}
                        </div>
                        <div className="border-t p-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-700">{user.nome.charAt(0)}</div>
                                <div className="flex-1"><div style={{fontSize: '13px'}} className="font-medium">{user.nome}</div><div style={{fontSize: '11px'}} className="text-gray-500">{user.perfil}</div></div>
                                <button onClick={() => { setUser(null); sessionStorage.clear(); localStorage.clear(); }} className="text-gray-400 hover:text-gray-600">↗</button>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col overflow-hidden">
                        <div className="bg-white border-b px-8 py-4 flex items-center justify-between">
                            <div>
                                <h1 style={{fontSize: '22px'}} className="font-bold text-gray-900">{menuItems.find(m => m.id === page)?.label}</h1>
                                <p style={{fontSize: '12px'}} className="text-gray-500 mt-0.5">
                                    {page === 'workspace' && notifications.length > 0 && `${notifications.length} notificações pendentes`}
                                    {page !== 'workspace' && 'Visão geral e métricas'}
                                </p>
                            </div>
                            <div className="flex gap-3">
                                {page === 'workspace' && <button onClick={() => setShowModal({type: 'contato'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Novo Lead</button>}
                                {page === 'vendas' && <button onClick={() => setShowModal({type: 'venda'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Nova Venda</button>}
                                {page === 'clientes' && <button onClick={() => setShowModal({type: 'cliente'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Novo Cliente</button>}
                                {page === 'clientes_finais' && (<><button onClick={() => setShowModal({type: 'import'})} className="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">📊 Importar</button><button onClick={() => setShowModal({type: 'contato'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Novo Contato</button></>)}
                                {page === 'ligacoes' && <button onClick={() => setShowModal({type: 'ligacao'})} className="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg font-medium text-sm transition-all">+ Nova Atividade</button>}
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-8">
                            {page === 'workspace' && <Workspace contatos={data.clientesFinais} clientes={data.clientes} ligacoes={data.ligacoes} vendas={data.vendas} notifications={notifications} onUpdateContact={editContato} showToast={showToast} onAddLigacao={addLigacao} onOpenDetails={(c) => setShowModal({type: 'detalhes', data: c})} />}
                            {page === 'pipeline' && <Pipeline contatos={data.clientesFinais} clientes={data.clientes} ligacoes={data.ligacoes} vendas={data.vendas} onUpdateContact={editContato} showToast={showToast} onOpenDetails={(c) => setShowModal({type: 'detalhes', data: c})} />}
                            {page === 'dashboard' && <Dashboard kpis={kpis} fmt={fmt} vendas={data.vendas} ligacoes={data.ligacoes} vendedores={data.vendedores} />}
                            {page === 'vendas' && <Vendas vendas={data.vendas} vendedores={data.vendedores} clientes={data.clientes} fmt={fmt} showToast={showToast} onEdit={(v) => setShowModal({type: 'venda', data: v})} onDelete={deleteVenda} />}
                            {page === 'clientes' && <Clientes clientes={data.clientes} showToast={showToast} onEdit={(c) => setShowModal({type: 'cliente', data: c})} onDelete={deleteCliente} />}
                            {page === 'clientes_finais' && <Contatos contatos={data.clientesFinais} clientes={data.clientes} showToast={showToast} onEdit={(c) => setShowModal({type: 'contato', data: c})} onDelete={deleteContato} />}
                            {page === 'ligacoes' && <Atividades ligacoes={data.ligacoes} vendedores={data.vendedores} clientes={data.clientes} showToast={showToast} onEdit={(l) => setShowModal({type: 'ligacao', data: l})} onDelete={deleteLigacao} />}
                            {page === 'usuarios' && <Usuarios usuarios={data.usuarios} showToast={showToast} onEdit={(u) => setShowModal({type: 'usuario', data: u})} onDelete={(id) => { if(window.confirm('Excluir?')) alert('Em desenvolvimento'); }} onAdd={() => setShowModal({type: 'usuario'})} />}
                            {page === 'metas' && <Metas vendedores={data.vendedores} vendas={data.vendas} ligacoes={data.ligacoes} showToast={showToast} />}
                            {page === 'relatorios' && <Relatorios vendas={data.vendas} vendedores={data.vendedores} clientes={data.clientes} clientesFinais={data.clientesFinais} fmt={fmt} />}
                            {page === 'comissoes' && <Comissoes vendas={data.vendas} vendedores={data.vendedores} fmt={fmt} showToast={showToast} />}
                        </div>
                    </div>
                    {toast && (
                        <div style={{position: 'fixed', top: '20px', right: '20px', background: 'white', padding: '14px 20px', borderRadius: '10px', boxShadow: '0 4px 12px rgba(0,0,0,0.1)', borderLeft: toast.type === 'error' ? '3px solid #ef4444' : '3px solid #4caf50', fontSize: '13px'}}>
                            <span className="font-medium">{toast.type === 'error' ? '✕' : '✓'} {toast.msg}</span>
                        </div>
                    )}
                    {showModal?.type === 'cliente' && <ModalCliente data={showModal.data} onSave={(f) => showModal.data ? editCliente(showModal.data.id, f) : addCliente(f)} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'contato' && <ModalContato data={showModal.data} clientes={data.clientes} onSave={(f) => showModal.data ? editContato(showModal.data.id, f) : addContato(f)} onClose={() => setShowModal(null)} />}
                    {showModal?.type === 'venda' && <ModalVenda data={showModal.data} clientes={data.clientes} vendedores={data.vendedores} onSave={(f) => showModal.data ? editVenda(showModal.data.id, f) : addVenda(f)} onClose={() => setShowModal(null)} />}

        function Workspace({ contatos, clientes, ligacoes, vendas, notifications, onUpdateContact, showToast, onAddLigacao, onOpenDetails }) {
    const [metaDiaria, setMetaDiaria] = React.useState(() => parseInt(localStorage.getItem('metaDiariaGlobal') || '15'));
    
    const calcularScoreLead = (contato) => {
        let score = 0;
        const agora = new Date();
        const statusScores = {'negociacao': 40, 'interessado': 30, 'contato': 20, 'novo': 15, 'fechado': 0};
        score += statusScores[contato.status] || 10;
        if (contato.prioridade === 'high') score += 25;
        else if (contato.prioridade === 'medium') score += 15;
        else score += 5;
        if (contato.ultima_interacao) {
            const dias = (agora - new Date(contato.ultima_interacao)) / (1000 * 60 * 60 * 24);
            if (dias < 1) score += 20;
            else if (dias < 3) score += 15;
            else if (dias < 7) score += 10;
            else if (dias >= 7) score -= 10;
        } else { score += 10; }
        if (contato.proximo_followup) {
            const horas = (new Date(contato.proximo_followup) - agora) / (1000 * 60 * 60);
            if (horas > 0 && horas < 2) score += 25;
            else if (horas > 0 && horas < 24) score += 15;
        }
        const tags = contato.tags ? JSON.parse(contato.tags) : [];
        if (tags.includes('urgente')) score += 20;
        if (tags.includes('vip')) score += 15;
        if (tags.includes('quente')) score += 15;
        return Math.min(score, 100);
    };
    
    const sugerirAcao = (contato) => {
        const agora = new Date();
        if (contato.status === 'negociacao') return {acao: '🔥 FECHAR VENDA AGORA', cor: 'bg-red-600', urgencia: 'CRÍTICO'};
        if (contato.proximo_followup) {
            const horas = (new Date(contato.proximo_followup) - agora) / (1000 * 60 * 60);
            if (horas > 0 && horas < 2) return {acao: '⏰ FOLLOW-UP AGENDADO', cor: 'bg-orange-600', urgencia: 'URGENTE'};
        }
        if (contato.status === 'interessado') return {acao: '📞 LIGAR HOJE', cor: 'bg-blue-600', urgencia: 'ALTA'};
        if (contato.status === 'novo') return {acao: '🆕 PRIMEIRO CONTATO', cor: 'bg-green-600', urgencia: 'MÉDIA'};
        return {acao: '💬 ACOMPANHAR', cor: 'bg-gray-600', urgencia: 'BAIXA'};
    };
    
    const calcularProbabilidade = (contato) => {
        let prob = 0;
        if (contato.status === 'negociacao') prob = 75;
        else if (contato.status === 'interessado') prob = 45;
        else if (contato.status === 'contato') prob = 25;

        if (efetivadas >= 3) prob += 15;
        else if (efetivadas >= 2) prob += 10;

        return Math.min(prob, 95);

        function Atividades({ ligacoes, vendedores, clientes, showToast, onEdit, onDelete }) {
            const [busca, setBusca] = useState('');
            const [filtroVendedor, setFiltroVendedor] = useState('');
            const [filtroStatus, setFiltroStatus] = useState('');
            const [ordenacao, setOrdenacao] = useState({ campo: 'data', direcao: 'desc' });

            let ligacoesFiltradas = ligacoes.filter(l => {
                const buscaMatch = busca === '' || l.cliente_nome.toLowerCase().includes(busca.toLowerCase()) || l.vendedor_nome.toLowerCase().includes(busca.toLowerCase());
                const vendedorMatch = filtroVendedor === '' || l.vendedor_id === parseInt(filtroVendedor);
                const statusMatch = filtroStatus === '' || l.status === filtroStatus;
                return buscaMatch && vendedorMatch && statusMatch;
            });

            ligacoesFiltradas.sort((a, b) => {
                let valA = a[ordenacao.campo];
                let valB = b[ordenacao.campo];
                if (valA < valB) return ordenacao.direcao === 'asc' ? -1 : 1;
                if (valA > valB) return ordenacao.direcao === 'asc' ? 1 : -1;
                return 0;
            });

            const alternarOrdenacao = (campo) => {
                if (ordenacao.campo === campo) {
                    setOrdenacao({ campo, direcao: ordenacao.direcao === 'asc' ? 'desc' : 'asc' });
                } else {
                    setOrdenacao({ campo, direcao: 'asc' });
                }
            };

            const exportarExcel = () => {
                const dados = ligacoesFiltradas.map(l => ({
                    Cliente: l.cliente_nome,
                    Vendedor: l.vendedor_nome,
                    Status: l.status === 'efetivada' ? 'Efetivada' : 'Tentada',
                    Data: new Date(l.data).toLocaleDateString('pt-BR')
                }));
                exportToExcel(dados, 'Atividades_' + new Date().toISOString().split('T')[0]);
                showToast('Excel exportado com sucesso!');
            };

            const exportarPDF = () => {
                const headers = ['Cliente', 'Vendedor', 'Status', 'Data'];
                const rows = ligacoesFiltradas.map(l => [
                    l.cliente_nome,
                    l.vendedor_nome,
                    l.status === 'efetivada' ? 'Efetivada' : 'Tentada',
                    new Date(l.data).toLocaleDateString('pt-BR')
                ]);
                exportToPDF(headers, rows, 'Relatório de Atividades', 'Atividades_' + new Date().toISOString().split('T')[0]);
                showToast('PDF exportado com sucesso!');
            };

            const handleDelete = (id) => {
                if (window.confirm('Tem certeza que deseja excluir esta atividade?')) {
                    onDelete(id);
                }
            };

            return (<div className="space-y-4"><div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100"><div className="grid grid-cols-5 gap-3"><input type="text" placeholder="🔍 Buscar atividades..." value={busca} onChange={(e) => setBusca(e.target.value)} style={{fontSize: '12px'}} className="col-span-2 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" /><select value={filtroVendedor} onChange={(e) => setFiltroVendedor(e.target.value)} style={{fontSize: '12px'}} className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"><option value="">Todos vendedores</option>{vendedores.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}</select><select value={filtroStatus} onChange={(e) => setFiltroStatus(e.target.value)} style={{fontSize: '12px'}} className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"><option value="">Todos status</option><option value="efetivada">Efetivada</option><option value="tentada">Tentada</option></select><div className="flex gap-2"><button onClick={exportarExcel} style={{fontSize: '11px'}} className="flex-1 px-3 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium">📊 Excel</button><button onClick={exportarPDF} style={{fontSize: '11px'}} className="flex-1 px-3 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium">📄 PDF</button></div></div><div style={{fontSize: '11px'}} className="text-gray-500 mt-2">{ligacoesFiltradas.length} atividades encontradas</div></div><div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"><table className="w-full"><thead className="bg-gray-50 border-b border-gray-200"><tr><th onClick={() => alternarOrdenacao('cliente_nome')} className="sortable-header px-6 py-3 text-left" style={{fontSize: '11px'}}><div className="flex items-center gap-1 font-semibold text-gray-600 uppercase">Cliente {ordenacao.campo === 'cliente_nome' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th onClick={() => alternarOrdenacao('vendedor_nome')} className="sortable-header px-6 py-3 text-left" style={{fontSize: '11px'}}><div className="flex items-center gap-1 font-semibold text-gray-600 uppercase">Vendedor {ordenacao.campo === 'vendedor_nome' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th onClick={() => alternarOrdenacao('status')} className="sortable-header px-6 py-3 text-center" style={{fontSize: '11px'}}><div className="flex items-center justify-center gap-1 font-semibold text-gray-600 uppercase">Status {ordenacao.campo === 'status' && <span>{ordenacao.direcao === 'asc' ? '↑' : '↓'}</span>}</div></th><th className="px-6 py-3 text-center" style={{fontSize: '11px'}}><div className="font-semibold text-gray-600 uppercase">Ações</div></th></tr></thead><tbody className="divide-y divide-gray-100">{ligacoesFiltradas.map(l => (<tr key={l.id} className="hover:bg-gray-50"><td className="px-6 py-4"><span style={{fontSize: '13px'}} className="font-medium text-gray-900">{l.cliente_nome}</span></td><td className="px-6 py-4"><span style={{fontSize: '12px'}} className="text-gray-600">{l.vendedor_nome}</span></td><td className="px-6 py-4 text-center"><span style={{fontSize: '10px'}} className={'px-3 py-1 rounded-full font-semibold ' + (l.status === 'efetivada' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600')}>{l.status === 'efetivada' ? 'Efetivada' : 'Tentada'}</span></td><td className="px-6 py-4 text-center"><div className="flex items-center justify-center gap-2"><button onClick={() => onEdit(l)} style={{fontSize: '11px'}} className="px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded font-medium">✏️</button><button onClick={() => handleDelete(l.id)} style={{fontSize: '11px'}} className="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded font-medium">🗑️</button></div></td></tr>))}</tbody></table></div></div>);
        }

function Metas({ vendedores, vendas, ligacoes, showToast }) {
    const [selectedVendedor, setSelectedVendedor] = useState('');
    const [metaDiaria, setMetaDiaria] = useState(15);
    const [metaMensal, setMetaMensal] = useState(50000);
    
    const salvarMeta = () => {
        if (!selectedVendedor) {
            showToast('Selecione um vendedor!', 'error');
            return;
        }
        localStorage.setItem('meta_' + selectedVendedor, JSON.stringify({
            diaria: metaDiaria, 
            mensal: metaMensal,
            data: new Date().toISOString()
        }));
        showToast('Meta salva com sucesso!');
        setSelectedVendedor('');
    };
    
    const hoje = new Date().toDateString();
    const mesAtual = new Date().getMonth();
    
    return (
        <div className="space-y-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border">
                <h2 className="text-2xl font-bold mb-6">🎯 Definir Metas por Vendedor</h2>
                <div className="grid grid-cols-3 gap-4">
                    <div>
                        <label className="block text-sm font-medium mb-2 text-gray-700">Vendedor</label>
                        <select value={selectedVendedor} onChange={(e) => setSelectedVendedor(e.target.value)} className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-green-500">
                            <option value="">Selecione...</option>
                            {vendedores.map(v => <option key={v.id} value={v.id}>{v.nome}</option>)}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-medium mb-2 text-gray-700">Meta Diária (ligações)</label>
                        <input type="number" value={metaDiaria} onChange={(e) => setMetaDiaria(parseInt(e.target.value))} className="w-full px-4 py-3 border rounded-lg" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium mb-2 text-gray-700">Meta Mensal (R$)</label>
                        <input type="number" value={metaMensal} onChange={(e) => setMetaMensal(parseInt(e.target.value))} className="w-full px-4 py-3 border rounded-lg" />
                    </div>
                </div>
                <button onClick={salvarMeta} className="mt-6 px-8 py-3 bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold">💾 Salvar Meta</button>
            </div>
            
            <div className="grid grid-cols-3 gap-4">
                {vendedores.map(v => {
                    const meta = JSON.parse(localStorage.getItem('meta_' + v.id) || '{"diaria":0,"mensal":0}');
                    const ligacoesHoje = ligacoes.filter(l => l.vendedor_id === v.id && new Date(l.data).toDateString() === hoje).length;
                    const vendasMes = vendas.filter(vd => vd.vendedor_id === v.id && new Date(vd.data).getMonth() === mesAtual);
                    const faturamentoMes = vendasMes.reduce((s, vd) => s + parseFloat(vd.valor_bruto || 0), 0);
                    const progressoDiario = meta.diaria > 0 ? (ligacoesHoje / meta.diaria) * 100 : 0;
                    const progressoMensal = meta.mensal > 0 ? (faturamentoMes / meta.mensal) * 100 : 0;
                    
                    return (
                        <div key={v.id} className="bg-white p-6 rounded-xl shadow-lg border-2">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center text-white font-bold text-xl">{v.nome.charAt(0)}</div>
                                <div><h3 className="font-bold text-lg">{v.nome}</h3><p className="text-xs text-gray-500">Performance</p></div>
                            </div>
                            <div className="mb-4">
                                <div className="flex justify-between mb-2"><span className="text-sm font-medium">Ligações Hoje</span><span className="text-sm font-bold">{ligacoesHoje} / {meta.diaria}</span></div>
                                <div className="w-full bg-gray-200 rounded-full h-3"><div className={'h-3 rounded-full ' + (progressoDiario >= 100 ? 'bg-green-500' : 'bg-blue-500')} style={{width: Math.min(progressoDiario, 100) + '%'}}></div></div>
                                <p className="text-xs text-gray-500 mt-1">{progressoDiario.toFixed(0)}% da meta</p>
                            </div>
                            <div>
                                <div className="flex justify-between mb-2"><span className="text-sm font-medium">Faturamento Mês</span><span className="text-sm font-bold">R$ {faturamentoMes.toLocaleString('pt-BR')}</span></div>
                                <div className="w-full bg-gray-200 rounded-full h-3"><div className={'h-3 rounded-full ' + (progressoMensal >= 100 ? 'bg-green-500' : 'bg-orange-500')} style={{width: Math.min(progressoMensal, 100) + '%'}}></div></div>
                                <p className="text-xs text-gray-500 mt-1">{progressoMensal.toFixed(0)}% da meta (R$ {meta.mensal.toLocaleString('pt-BR')})</p>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

                <div className="space-y-3">
                    {clientes.map(c => {
                        const leads = clientesFinais.filter(cf => cf.cliente_primario_id === c.id);
                        const vendasC = vendas.filter(v => v.cliente_id === c.id);
                        return (
                            <div key={c.id} className="p-4 border rounded-xl">
                                <h4 className="font-bold text-lg mb-2">{c.nome}</h4>
                                <div className="grid grid-cols-4 gap-3 text-sm">
                                    <div className="text-center p-2 bg-blue-50 rounded"><div className="font-bold text-xl text-blue-600">{leads.length}</div><div className="text-xs">Leads</div></div>
                                    <div className="text-center p-2 bg-green-50 rounded"><div className="font-bold text-xl text-green-600">{vendasC.length}</div><div className="text-xs">Vendas</div></div>
                                    <div className="text-center p-2 bg-purple-50 rounded"><div className="font-bold text-xl text-purple-600">{leads.length > 0 ? ((vendasC.length/leads.length)*100).toFixed(0) : 0}%</div><div className="text-xs">Conversão</div></div>
                                    <div className="text-center p-2 bg-yellow-50 rounded"><div className="font-bold text-xl text-yellow-600">{fmt(vendasC.reduce((s,v) => s + parseFloat(v.valor_bruto||0), 0))}</div><div className="text-xs">Faturado</div></div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
}

// ========================================
// 💰 COMPONENTE COMISSÕES
// ========================================
function Comissoes({ vendas, vendedores, fmt, showToast }) {
    const [filtroPago, setFiltroPago] = useState('pendente');
    
    const vendasFiltradas = vendas.filter(v => 
        filtroPago === 'todos' ? true : 
        filtroPago === 'pago' ? v.comissao_paga : 
        !v.comissao_paga
    );
    
    return (
        <div className="space-y-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border">
                <select value={filtroPago} onChange={(e) => setFiltroPago(e.target.value)} className="px-4 py-2 border rounded-lg">
                    <option value="pendente">💰 Pendentes</option>
                    <option value="pago">✅ Pagas</option>
                    <option value="todos">📋 Todas</option>
                </select>
            </div>
            
            <div className="grid grid-cols-3 gap-4">
                {vendedores.map(v => {
                    const vendasV = vendasFiltradas.filter(vd => vd.vendedor_id === v.id);
                    const totalComissao = vendasV.reduce((s, vd) => s + parseFloat(vd.valor_comissao || 0), 0);
                    return (
                        <div key={v.id} className="bg-white p-5 rounded-xl shadow-sm border">
                            <h3 className="font-bold text-lg mb-3">{v.nome}</h3>
                            <div className="text-3xl font-bold text-green-600 mb-2">{fmt(totalComissao)}</div>
                            <div className="text-sm text-gray-600">{vendasV.length} vendas</div>
                        </div>
                    );
                })}
            </div>
            
            <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table className="w-full">
                    <thead className="bg-gray-50 border-b">
                        <tr>
                            <th className="px-6 py-3 text-left text-xs font-semibold">Vendedor</th>
                            <th className="px-6 py-3 text-left text-xs font-semibold">Cliente</th>
                            <th className="px-6 py-3 text-right text-xs font-semibold">Venda</th>
                            <th className="px-6 py-3 text-right text-xs font-semibold">Comissão</th>
                            <th className="px-6 py-3 text-center text-xs font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y">
                        {vendasFiltradas.map(v => (
                            <tr key={v.id} className="hover:bg-gray-50">
                                <td className="px-6 py-4 text-sm">{v.vendedor_nome}</td>
                                <td className="px-6 py-4 text-sm">{v.cliente_nome}</td>
                                <td className="px-6 py-4 text-sm text-right font-bold">{fmt(v.valor_bruto)}</td>
                                <td className="px-6 py-4 text-sm text-right font-bold text-green-600">{fmt(v.valor_comissao)}</td>
                                <td className="px-6 py-4 text-center">
                                    <span className={'px-3 py-1 rounded-full text-xs font-semibold ' + (v.comissao_paga ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}>
                                        {v.comissao_paga ? '✅ Paga' : '⏳ Pendente'}
                                    </span>
                                </td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}



        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
