                        { label: 'Fechados', value: dados.leadsStatus.fechado, color: 'green', icon: '✅' }
                    ].map((status, i) => (
                        <div key={i} className={'bg-' + status.color + '-50 p-3 rounded-lg border-2 border-' + status.color + '-200'}>
                            <div className="text-center">
                                <div className="text-2xl mb-1">{status.icon}</div>
                                <div className={'text-2xl font-bold text-' + status.color + '-600'}>{status.value}</div>
                                <div className="text-[9px] text-gray-600 mt-1">{status.label}</div>
                                <div className="text-[8px] text-gray-500 mt-0.5">
                                    {dados.leadsStatus.novo > 0 ? ((status.value / dados.leadsStatus.novo) * 100).toFixed(0) : 0}% do total
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );
    }
    
    // LEADS SEM FOLLOW-UP - Layout de lista acionável
    else if (relatorioAtivo === 'leadsSemFollowup') {
        const leadsSemContato = dados.clientesFiltrados.filter(c => {
            const tresDias = new Date(new Date().getTime() - 3 * 24 * 60 * 60 * 1000);
            const ultima = c.ultima_interacao ? new Date(c.ultima_interacao) : null;
            return !ultima || ultima < tresDias;
        });
        
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className={'p-4 rounded-lg text-center ' + (leadsSemContato.length > dados.totalLeads * 0.3 ? 'bg-red-100 border-2 border-red-300' : 'bg-green-100 border-2 border-green-300')}>
                    <div className={'text-4xl font-bold mb-2 ' + (leadsSemContato.length > dados.totalLeads * 0.3 ? 'text-red-600' : 'text-green-600')}>
                        {leadsSemContato.length}
                    </div>
                    <div className="text-sm font-medium text-gray-700">Leads sem follow-up há 3+ dias</div>
                    <div className="text-xs text-gray-600 mt-1">
                        {leadsSemContato.length > dados.totalLeads * 0.3 ? '🚨 URGENTE: Muitos leads sem contato!' : '✅ Situação controlada'}
                    </div>
                </div>

                <div className="bg-white rounded-lg shadow-sm border">
                    <div className="bg-gray-50 p-3 border-b">
                        <h3 className="text-sm font-bold text-gray-800">📋 Lista de Leads Requerendo Ação</h3>
                    </div>
                    <div className="divide-y max-h-96 overflow-y-auto">
                        {leadsSemContato.length === 0 ? (
                            <div className="p-8 text-center text-gray-500">
                                <div className="text-4xl mb-2">✅</div>
                                <div className="text-sm">Todos os leads foram contatados recentemente!</div>
                            </div>
                        ) : (
                            leadsSemContato.map((lead, i) => {
                                const diasSemContato = lead.ultima_interacao ? Math.floor((new Date() - new Date(lead.ultima_interacao)) / (1000 * 60 * 60 * 24)) : 999;
                                return (
                                    <div key={i} className="p-3 hover:bg-gray-50">
                                        <div className="flex items-center justify-between">
                                            <div className="flex-1">
                                                <div className="text-[11px] font-bold text-gray-800">{lead.nome}</div>
                                                <div className="flex gap-2 mt-1">
                                                    {lead.telefone && <span className="text-[9px] text-gray-600">📞 {lead.telefone}</span>}
                                                    {lead.email && <span className="text-[9px] text-gray-600">✉️ {lead.email}</span>}
                                                </div>
                                            </div>
                                            <div className="text-right mr-3">
                                                <div className={'text-[10px] font-bold ' + (diasSemContato > 7 ? 'text-red-600' : 'text-orange-600')}>
                                                    {diasSemContato === 999 ? 'Nunca contatado' : diasSemContato + ' dias'}
                                                </div>
                                                <div className="text-[8px] text-gray-500">{lead.status}</div>
                                            </div>
                                            <button className="text-[9px] px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white rounded font-medium">
                                                📞 Ligar
                                            </button>
                                        </div>
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            </div>
        );
    }
    
    // VENDAS POR PERÍODO - Layout resumido
    else if (relatorioAtivo === 'vendasPeriodo') {
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="grid grid-cols-3 gap-3">
                    <div className="bg-gradient-to-br from-green-500 to-green-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Faturamento Total</div>
                        <div className="text-3xl font-bold">{fmt(dados.faturamentoTotal)}</div>
                        <div className={'text-xs mt-1 ' + (dados.crescimento >= 0 ? 'text-green-200' : 'text-red-200')}>
                            {dados.crescimento >= 0 ? '↗️' : '↘️'} {Math.abs(dados.crescimento).toFixed(1)}% vs período anterior
                        </div>
                    </div>
                    <div className="bg-gradient-to-br from-blue-500 to-blue-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Total de Vendas</div>
                        <div className="text-3xl font-bold">{dados.totalVendas}</div>
                        <div className="text-xs mt-1">{(dados.totalVendas / dados.diasPeriodo).toFixed(1)} vendas/dia</div>
                    </div>
                    <div className="bg-gradient-to-br from-purple-500 to-purple-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Ticket Médio</div>
                        <div className="text-3xl font-bold">{fmt(dados.ticketMedio)}</div>
                        <div className="text-xs mt-1">Por venda realizada</div>
                    </div>
                </div>

                <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-3">📅 Análise do Período</h3>
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <div className="text-[10px] text-gray-600 mb-2">Distribuição por Status</div>
                            <div className="space-y-2">
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Faturadas</span>
                                    <span className="text-[10px] font-bold text-green-600">
                                        {dados.vendasFiltradas.filter(v => v.faturada).length}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Pendentes</span>
                                    <span className="text-[10px] font-bold text-yellow-600">
                                        {dados.vendasFiltradas.filter(v => !v.faturada).length}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <div className="text-[10px] text-gray-600 mb-2">Métricas do Período</div>
                            <div className="space-y-2">
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Dias analisados</span>
                                    <span className="text-[10px] font-bold">{dados.diasPeriodo}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px]">Média diária</span>
                                    <span className="text-[10px] font-bold">{fmt(dados.faturamentoTotal / dados.diasPeriodo)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    }
    
    // PERFORMANCE CLIENTE B2B - Layout detalhado
    else if (relatorioAtivo === 'clientesB2B') {
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="bg-white p-3 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-3">🏢 Análise Detalhada por Cliente B2B</h3>
                    <div className="space-y-2">
                        {clientes.map(c => {
                            const leads = dados.clientesFiltrados.filter(cf => cf.cliente_primario_id === c.id);
                            const vendasC = dados.vendasFiltradas.filter(v => v.cliente_id === c.id);
                            const conversao = leads.length > 0 ? (vendasC.length / leads.length) * 100 : 0;
                            const faturamento = vendasC.reduce((s, v) => s + parseFloat(v.valor_bruto || 0), 0);
                            const ticketMedioCliente = vendasC.length > 0 ? faturamento / vendasC.length : 0;
                            
                            return (
                                <div key={c.id} className="p-3 border-2 rounded-lg hover:border-green-300 transition-all">
                                    <div className="flex items-center justify-between mb-2">
                                        <h4 className="text-[11px] font-bold">{c.nome}</h4>
                                        <div className="text-right">
                                            <div className="text-base font-bold text-green-600">{fmt(faturamento)}</div>
                                            <div className="text-[8px] text-gray-500">Faturamento total</div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-5 gap-2">
                                        <div className="text-center p-2 bg-blue-50 rounded">
                                            <div className="text-base font-bold text-blue-600">{leads.length}</div>
                                            <div className="text-[8px] text-gray-600">Leads</div>
                                        </div>
                                        <div className="text-center p-2 bg-green-50 rounded">
                                            <div className="text-base font-bold text-green-600">{vendasC.length}</div>
                                            <div className="text-[8px] text-gray-600">Vendas</div>
                                        </div>
                                        <div className="text-center p-2 bg-purple-50 rounded">
                                            <div className="text-base font-bold text-purple-600">{conversao.toFixed(0)}%</div>
                                            <div className="text-[8px] text-gray-600">Conversão</div>
                                        </div>
                                        <div className="text-center p-2 bg-orange-50 rounded">
                                            <div className="text-base font-bold text-orange-600">{fmt(ticketMedioCliente)}</div>
                                            <div className="text-[8px] text-gray-600">Ticket</div>
                                        </div>
                                        <div className={'text-center p-2 rounded ' + (conversao >= 20 ? 'bg-green-100' : conversao >= 10 ? 'bg-yellow-100' : 'bg-red-100')}>
                                            <div className="text-lg">{conversao >= 20 ? '🔥' : conversao >= 10 ? '⚡' : '❄️'}</div>
                                            <div className="text-[8px] text-gray-600">Status</div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }
    
    // MELHOR DIA DA SEMANA - Layout de análise temporal
    else if (relatorioAtivo === 'melhorDiaSemana') {
        const faturamentoPorDia = [0,0,0,0,0,0,0];
        dados.vendasFiltradas.forEach(v => {
            faturamentoPorDia[new Date(v.data).getDay()] += parseFloat(v.valor_bruto || 0);
        });
        const diaComMaiorFaturamento = faturamentoPorDia.indexOf(Math.max(...faturamentoPorDia));
        
        conteudoRelatorio = (
            <div className="space-y-3">
                <div className="grid grid-cols-2 gap-3">
                    <div className="bg-gradient-to-br from-green-500 to-green-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Melhor Dia por Quantidade</div>
                        <div className="text-4xl font-bold mb-1">{dados.diasSemana[dados.melhorDia]}</div>
                        <div className="text-sm">{dados.vendasPorDia[dados.melhorDia]} vendas realizadas</div>
                    </div>
                    <div className="bg-gradient-to-br from-blue-500 to-blue-600 p-4 rounded-lg shadow-lg text-white text-center">
                        <div className="text-[10px] opacity-75 mb-1">Melhor Dia por Faturamento</div>
                        <div className="text-4xl font-bold mb-1">{dados.diasSemana[diaComMaiorFaturamento]}</div>
                        <div className="text-sm">{fmt(faturamentoPorDia[diaComMaiorFaturamento])} faturado</div>
                    </div>
                </div>

                <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <h3 className="text-sm font-bold text-gray-800 mb-4">📊 Análise Completa por Dia da Semana</h3>
                    <div className="space-y-3">
                        {dados.diasSemana.map((dia, i) => {
                            const vendas = dados.vendasPorDia[i];
                            const faturamento = faturamentoPorDia[i];
                            const ticketDia = vendas > 0 ? faturamento / vendas : 0;
                            const maxVendas = Math.max(...dados.vendasPorDia);
                            const percVendas = maxVendas > 0 ? (vendas / maxVendas) * 100 : 0;
                            
                            return (
                                <div key={i} className={'p-3 rounded-lg border-2 ' + (i === dados.melhorDia ? 'border-green-400 bg-green-50' : 'border-gray-200')}>
                                    <div className="flex items-center justify-between mb-2">
                                        <div className="flex items-center gap-2">
                                            <div className={'w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs ' + (i === dados.melhorDia ? 'bg-green-500' : 'bg-gray-400')}>
                                                {dia.substring(0, 1)}
                                            </div>
                                            <div>
                                                <div className="text-[11px] font-bold">{dia}</div>
                                                <div className="text-[8px] text-gray-500">{vendas} vendas</div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[11px] font-bold text-green-600">{fmt(faturamento)}</div>
                                            <div className="text-[8px] text-gray-500">Ticket: {fmt(ticketDia)}</div>
                                        </div>
                                    </div>
                                    <div className="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
                                        <div className={'h-full rounded-full ' + (i === dados.melhorDia ? 'bg-green-500' : 'bg-blue-400')} style={{width: percVendas + '%'}}></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>
        );
    }
    
    // DEFAULT - Para relatórios ainda não implementados
    else {
        conteudoRelatorio = (
            <div className="bg-white p-8 rounded-lg shadow-sm border text-center">
                <div className="text-6xl mb-4">🚧</div>
                <h3 className="text-lg font-bold text-gray-800 mb-2">Relatório em Desenvolvimento</h3>
                <p className="text-sm text-gray-600">Este relatório específico ainda está sendo construído.</p>
                <button onClick={voltarListaRelatorios} className="mt-4 text-sm px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded font-medium">
                    ← Voltar para Lista de Relatórios
                </button>
            </div>
        );
    }
    
    // Renderizar relatório ativo
    return (
        <div className="space-y-3">
            <HeaderFiltros />
            {conteudoRelatorio}
        </div>
    );
}
function Comissoes({ vendas, vendedores, fmt, showToast, usuarioLogado }) {
    const [filtroPago, setFiltroPago] = useState('pendente');
    
    // Filtrar vendedores baseado no perfil
    const vendedoresFiltrados = usuarioLogado?.perfil === 'vendedor'
        ? vendedores.filter(v => v.id === usuarioLogado.id)
        : usuarioLogado?.perfil === 'gerente'
        ? vendedores.filter(v => v.gerente_id === usuarioLogado.id)
        : vendedores;
    
    const vendasFiltradas = vendas.filter(v => 
        filtroPago === 'todos' ? true : 
        filtroPago === 'pago' ? v.comissao_paga : 
        !v.comissao_paga
    );
    
    return (
        <div className="space-y-4">
            <div className="bg-white p-4 rounded-xl shadow-sm border">
                <select value={filtroPago} onChange={(e) => setFiltroPago(e.target.value)} className="px-4 py-2 border rounded-lg">
                    <option value="pendente">💰 Pendentes</option>
                    <option value="pago">✅ Pagas</option>
                    <option value="todos">📋 Todas</option>
                </select>
            </div>
            
            <div className="grid grid-cols-3 gap-4">
                {vendedoresFiltrados.map(v => {
                    const vendasV = vendasFiltradas.filter(vd => vd.vendedor_id === v.id);
                    const totalComissao = vendasV.reduce((s, vd) => s + parseFloat(vd.valor_comissao || 0), 0);
                    return (
                        <div key={v.id} className="bg-white p-5 rounded-xl shadow-sm border">
                            <h3 className="font-bold text-lg mb-3">{v.nome}</h3>
                            <div className="text-3xl font-bold text-green-600 mb-2">{fmt(totalComissao)}</div>
                            <div className="text-sm text-gray-600">{vendasV.length} vendas</div>
                        </div>
                    );
                })}
            </div>
            
            <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table className="w-full">
                    <thead className="bg-gray-50 border-b">
                        <tr>
                            <th className="px-6 py-3 text-left text-xs font-semibold">Vendedor</th>
                            <th className="px-6 py-3 text-left text-xs font-semibold">Cliente</th>
                            <th className="px-6 py-3 text-right text-xs font-semibold">Venda</th>
                            <th className="px-6 py-3 text-right text-xs font-semibold">Comissão</th>
                            <th className="px-6 py-3 text-center text-xs font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody className="divide-y">
                        {vendasFiltradas.map(v => (
                            <tr key={v.id} className="hover:bg-gray-50">
                                <td className="px-6 py-4 text-sm">{v.vendedor_nome}</td>
                                <td className="px-6 py-4 text-sm">{v.cliente_nome}</td>
                                <td className="px-6 py-4 text-sm text-right font-bold">{fmt(v.valor_bruto)}</td>
                                <td className="px-6 py-4 text-sm text-right font-bold text-green-600">{fmt(v.valor_comissao)}</td>
                                <td className="px-6 py-4 text-center">
                                    <span className={'px-3 py-1 rounded-full text-xs font-semibold ' + (v.comissao_paga ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}>
                                        {v.comissao_paga ? '✅ Paga' : '⏳ Pendente'}
                                    </span>
                                </td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}



        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
